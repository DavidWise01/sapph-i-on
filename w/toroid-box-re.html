<title>Toroid in a Box — rev23</title>
<style>
  :root{
    --bg:#0A0D1C;
    --surface: rgba(16,21,42,.90);
    --surface-2: rgba(22,28,56,.92);
    --border: rgba(148,166,198,.18);
    --cyan:#43E8FF;
    --violet:#C977FF;
    --green:#78F0B1;
    --red:#FF6B7A;
    --yellow:#FFE28B;
    --ink:#E6EAF5;
    --muted:#94A6C6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;width:100vw;background:radial-gradient(120% 120% at 20% 10%, rgba(67,232,255,.14) 0%, transparent 40%), radial-gradient(100% 100% at 80% 20%, rgba(201,119,255,.12) 0%, transparent 38%), var(--bg);}
  .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:rgba(10,13,28,.82);backdrop-filter: blur(12px);z-index:10}
  .title{letter-spacing:.18em;font-weight:700;font-size:13px;display:flex;gap:14px;align-items:center}
  .title b{color:var(--ink)} .title span{color:var(--muted);font-weight:400;letter-spacing:.12em}
  .live{font-size:10px;letter-spacing:.2em;padding:6px 10px;border:1px solid rgba(67,232,255,.35);background:rgba(67,232,255,.08);color:var(--cyan);border-radius:999px;display:flex;align-items:center;gap:8px}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);display:inline-block;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .main{flex:1;display:flex;min-height:0}
  .scene-wrap{flex:1.25;position:relative;min-width:0;background:linear-gradient(180deg, rgba(16,21,42,.4), rgba(10,13,28,.2));border-right:1px solid var(--border);overflow:hidden}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;pointer-events:none;z-index:2}
  .chip{pointer-events:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;backdrop-filter: blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04)}
  .chip-top-left{left:14px;top:14px;min-width:250px}
  .chip-top-right{right:14px;top:14px;min-width:210px;text-align:right}
  .chip-bottom{left:50%;transform:translateX(-50%);bottom:84px;min-width:360px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .label{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .mono{font-size:11px;line-height:1.4;color:var(--ink);white-space:nowrap}
  .mono b{font-weight:700}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .panel{width:360px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
  .panel-inner{padding:18px 18px 0 18px}
  .panel h2{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0 0 12px 0;font-weight:600}
  .panel p{font-size:11.5px;line-height:1.65;color:#C2CADB;margin:0 0 12px 0}
  .panel .quote{border-left:2px solid rgba(67,232,255,.35);padding-left:12px;margin:14px 0;color:#D8E0F2;background:rgba(67,232,255,.04);border-radius:0 8px 8px 0;padding-top:8px;padding-bottom:8px}
  .ladder-wrap{margin:12px 0 16px 0;background:rgba(10,13,28,.6);border:1px solid var(--border);border-radius:10px;padding:10px}
  #ladder{width:100%;height:108px;display:block;border-radius:6px}
  .mandel-card{margin:10px 18px 18px 18px;background:rgba(10,13,28,.72);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .mandel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
  .mandel-head span{font-size:9px;letter-spacing:.16em;color:var(--muted)}
  #mandelPreview{width:100%;aspect-ratio:1.2;display:block;background:#060914}
  .controls{height:72px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:10px 14px;border-top:1px solid var(--border);background:rgba(16,21,42,.94);backdrop-filter: blur(16px);z-index:10;overflow:auto}
  .ctrl{flex:1;min-width:120px}
  .ctrl label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
  .ctrl label b{color:var(--ink);font-weight:600;letter-spacing:.06em}
  input[type=range]{-webkit-appearance:none;width:100%;height:2px;background:rgba(148,166,198,.22);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border), 0 0 10px rgba(67,232,255,.4);cursor:pointer}
  .btns{display:flex;gap:8px;flex-shrink:0}
  .btn{font-family:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.08);border-color:rgba(148,166,198,.32)}
  .btn.cyan{border-color:rgba(67,232,255,.4);color:var(--cyan);background:rgba(67,232,255,.08)}
  .btn.cyan:hover{background:rgba(67,232,255,.14)}
  .btn.red{border-color:rgba(255,107,122,.35);color:var(--red);background:rgba(255,107,122,.06)}
  .kbd{font-size:9px;padding:2px 5px;border:1px solid var(--border);border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted)}
  @media(max-width:980px){
    .main{flex-direction:column}
    .panel{width:100%;border-left:none;border-top:1px solid var(--border);max-height:44vh}
    .scene-wrap{flex:none;height:58vh}
    .chip-bottom{min-width:92%;bottom:78px}
    .controls{height:auto;flex-wrap:wrap;padding-bottom:12px}
    .ctrl{min-width:46%}
  }

</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title"><b>TOROID IN A BOX — rev23</b><span>/ milkyway is toroidal, universe is square sheet</span></div>
    <div class="live"><i></i> LIVE SIM — vacuum indigo</div>
  </div>
  <div class="main">
    <div class="scene-wrap" id="sceneWrap">
      <canvas id="c"></canvas>
      <div class="hud chip chip-top-left" id="toroidChip">
        <div class="label">[ TOROID ] — milky way current</div>
        <div class="mono" id="toroidStats">R=3.50  r=0.78  V=0.00  E=1.21x</div>
        <div class="mono" style="margin-top:4px;color:var(--muted);font-size:10px" id="rippleStat">rippleWithinBound: true — Δ=0.00</div>
      </div>
      <div class="hud chip chip-top-right" id="voidChip">
        <div class="label">[ VOID ] — sheet pushback</div>
        <div class="mono" id="voidStats">pushback = 0.42 kPa (arb)</div>
        <div class="mono" style="margin-top:4px;color:var(--muted);font-size:10px" id="voidDetail">k=0.85  overlap=0.00  wall=5.0</div>
      </div>
      <div class="hud chip chip-bottom" id="statusChip">
        <div style="display:flex;align-items:center;gap:10px">
          <span id="statusDot" class="status-dot" style="background:var(--green)"></span>
          <span class="mono" id="statusText" style="font-weight:700;letter-spacing:.12em">HOMEOSTATIC — ripple locked</span>
        </div>
        <div class="mono" style="font-size:10px;color:var(--muted)" id="winnerText">no winner yet</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-inner">
        <h2>MODEL — TOROID IN A SQUARE SHEET</h2>
        <p>The Milky Way isn't a sphere, it's a toroidal current. The universe it lives in isn't infinite, it's a square sheet with bounds. 10×10×3 — flat, like paper, but rigid when pushed.</p>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>
<script>
// ——— Mandelbrot generator ———
function mandelbrotIter(cx, cy, maxIter){
  let x=0,y=0, x2=0,y2=0, iter=0;
  while(x2+y2 <= 4 && iter < maxIter){
    y = 2*x*y + cy;
    x = x2 - y2 + cx;
    x2 = x*x;
    y2 = y*y;
    iter++;
  }
  return iter;
}
function makePalette(){
  // blue -> violet -> cyan -> yellow
  return function(t){
    // t 0..1 where 1=inside set (black)
    if(t>=1) return [6,9,28];
    // piecewise
    if(t<0.25){
      let k=t/0.25;
      return [10 + k*30, 13 + k*10, 28 + k*30]; // deep blue to blue-violet
    }else if(t<0.55){
      let k=(t-0.25)/0.30;
      return [40 + k*80, 23 + k*60, 58 + k*70]; // violet to cyanish
    }else if(t<0.85){
      let k=(t-0.55)/0.30;
      return [120 + k*40, 83 + k*120, 128 + k*70];
    }else{
      let k=(t-0.85)/0.15;
      return [160 + k*95, 203 + k*25, 198 + k*-60];
    }
  }
}
var palette = makePalette();
function renderMandelbrotToCanvas(canvas, maxIter, zoom, offX, offY, timePhase){
  var w=canvas.width, h=canvas.height;
  var ctx=canvas.getContext('2d');
  var img=ctx.createImageData(w,h);
  var cx,cy,iter,t,rgb;
  var scale = 3.5 / zoom;
  for(var y=0;y<h;y++){
    for(var x=0;x<w;x++){
      // center bias + slight time wobble for alive feel
      var nx = (x - w*0.5) / w;
      var ny = (y - h*0.5) / h;
      cx = nx*scale + offX + Math.sin(timePhase*0.2 + ny*2)*0.02;
      cy = ny*scale + offY;
      iter = mandelbrotIter(cx,cy,maxIter);
      var idx = (y*w + x)*4;
      if(iter===maxIter){
        img.data[idx]=6; img.data[idx+1]=9; img.data[idx+2]=28; img.data[idx+3]=255;
      }else{
        t = iter / maxIter;
        // smooth
        // add slight modulation by angle for organic
        var mod = 0.08*Math.sin(nx*12 + timePhase*0.3);
        t = Math.min(1, Math.max(0, t + mod));
        rgb = palette(t);
        img.data[idx]=rgb[0]; img.data[idx+1]=rgb[1]; img.data[idx+2]=rgb[2]; img.data[idx+3]=255;
      }
    }
  }
  ctx.putImageData(img,0,0);
}

var mandelCanvas = document.getElementById('mandelPreview');
var mandelIter = 128;
var mandelZoom = 1.6;
var mandelOffX = -0.74;
var mandelOffY = 0.13;
renderMandelbrotToCanvas(mandelCanvas, mandelIter, mandelZoom, mandelOffX, mandelOffY, 0);

// ——— Three.js Scene ———
var sceneWrap = document.getElementById('sceneWrap');
var canvasEl = document.getElementById('c');
var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0A0D1C, 0.045);

var renderer = new THREE.WebGLRenderer({canvas:canvasEl, antialias:true, alpha:true});
renderer.setPixelRatio(window.devicePixelRatio||1);
renderer.setSize(sceneWrap.clientWidth, sceneWrap.clientHeight);
renderer.setClearColor(0x0A0D1C, 1);

var camera = new THREE.PerspectiveCamera(38, sceneWrap.clientWidth/sceneWrap.clientHeight, 0.1, 100);
camera.position.set(6.2, -6.8, 4.1);
var controls = null;
try{
  if(THREE.OrbitControls){
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping=true;
    controls.dampingFactor=0.08;
    controls.minDistance=3.5;
    controls.maxDistance=14;
    controls.target.set(0,0,0);
    controls.autoRotate=true;
    controls.autoRotateSpeed=0.6;
    controls.enablePan=false;
  }
}catch(e){}

scene.add(new THREE.AmbientLight(0x6A7AAA, 0.55));
var dirLight = new THREE.DirectionalLight(0xBFD8FF, 0.7);
dirLight.position.set(3, -2, 5);
scene.add(dirLight);
var pointCyan = new THREE.PointLight(0x43E8FF, 1.2, 20);
pointCyan.position.set(2,2,2);
scene.add(pointCyan);
var pointViolet = new THREE.PointLight(0xC977FF, 0.9, 18);
pointViolet.position.set(-3,-2,1.5);
scene.add(pointViolet);

// Box - universe square sheet
var boxW=10, boxH=10, boxD=3;
var boxGeo = new THREE.BoxGeometry(boxW, boxH, boxD);
var boxMat = new THREE.MeshBasicMaterial({color:0x94A6C6, wireframe:true, transparent:true, opacity:0.25});
var box = new THREE.Mesh(boxGeo, boxMat);
scene.add(box);
// inner glow box edges
var boxLineMat = new THREE.LineSegments ? null : null;
var boxHelper = new THREE.BoxHelper(box, 0x94A6C6);
boxHelper.material.opacity=0.18;
boxHelper.material.transparent=true;
scene.add(boxHelper);

// Mandelbrot texture for torus
var texCanvas = document.createElement('canvas');
texCanvas.width=512; texCanvas.height=512;
renderMandelbrotToCanvas(texCanvas, mandelIter, mandelZoom, mandelOffX, mandelOffY, 0);
var mandelTexture = new THREE.CanvasTexture(texCanvas);
mandelTexture.wrapS = THREE.RepeatWrapping;
mandelTexture.wrapT = THREE.RepeatWrapping;
mandelTexture.anisotropy = 4;

// Torus
var homeostasisR = 3.5;
var R = homeostasisR;
var minorR = 0.78;
var torusGeo = new THREE.TorusGeometry(R, minorR, 96, 192);
var torusMat = new THREE.MeshStandardMaterial({
  map: mandelTexture,
  color: 0xFFFFFF,
  emissive: 0x43E8FF,
  emissiveIntensity: 0.28,
  roughness: 0.38,
  metalness: 0.15,
  transparent:false
});
var torus = new THREE.Mesh(torusGeo, torusMat);
scene.add(torus);
// glow torus
var glowGeo = new THREE.TorusGeometry(R+0.04, minorR+0.12, 64, 128);
var glowMat = new THREE.MeshBasicMaterial({color:0x43E8FF, transparent:true, opacity:0.10, blending:THREE.AdditiveBlending, depthWrite:false});
var glow = new THREE.Mesh(glowGeo, glowMat);
scene.add(glow);

// void particles
var partCount = 600;
var partGeo = new THREE.BufferGeometry();
var partPos = new Float32Array(partCount*3);
var partVel = new Float32Array(partCount*3);
for(var i=0;i<partCount;i++){
  var ang = Math.random()*Math.PI*2;
  var rad = 5.5 + Math.random()*4.5;
  partPos[i*3]=Math.cos(ang)*rad;
  partPos[i*3+1]=Math.sin(ang)*rad;
  partPos[i*3+2]=(Math.random()-0.5)*6;
  partVel[i*3]= (Math.random()-0.5)*0.01;
  partVel[i*3+1]=(Math.random()-0.5)*0.01;
  partVel[i*3+2]=(Math.random()-0.5)*0.005;
}
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos,3));
var partMat = new THREE.PointsMaterial({color:0x94A6C6, size:0.06, transparent:true, opacity:0.38, sizeAttenuation:true});
var points = new THREE.Points(partGeo, partMat);
scene.add(points);

// physics state
var state = {
  R: homeostasisR,
  minorR: 0.78,
  vel: 0,
  expansionRate: 1.20,
  voidK: 0.85,
  damping: 0.38,
  homeostasisR: homeostasisR,
  time: 0,
  ripplePhase: 0
};
var status = {mode:'HOMEOSTATIC', winner:'none'};
var tmpBoxScale = 1;

function computeOverlap(Rmaj, rmin){
  var wall = boxW*0.5; // 5
  var reach = Rmaj + rmin;
  return Math.max(0, reach - (wall - 0.18));
}

function rebuildTorus(){
  // dispose old
  torus.geometry.dispose();
  glow.geometry.dispose();
  var newGeo = new THREE.TorusGeometry(state.R, state.minorR, 96, 192);
  var newGlow = new THREE.TorusGeometry(state.R+0.04, state.minorR+0.12, 64, 128);
  torus.geometry = newGeo;
  glow.geometry = newGlow;
}

function updatePhysics(dt){
  state.time += dt;
  state.ripplePhase += dt*1.1;

  var overlap = computeOverlap(state.R, state.minorR);
  var homeDelta = state.R - state.homeostasisR;

  var voidPush = state.voidK * (Math.pow(overlap+0.01, 1.45)*5.0 + Math.max(0, homeDelta)*0.9);
  // expansion push includes sinusoidal + mandelbrot ripple
  var rippleNoise = Math.sin(state.time*0.9)*0.12 + Math.sin(state.time*2.3)*0.06 + Math.sin(state.time*0.37)*0.08;
  var expansionPush = state.expansionRate * (0.85 + 0.35*Math.sin(state.time*0.62 + rippleNoise));

  var accel = expansionPush - voidPush - state.damping*state.vel*1.8 - homeDelta*0.15*state.voidK;
  state.vel += accel*dt;
  state.vel = Math.max(-3, Math.min(3, state.vel));
  state.R += state.vel*dt;

  // bounds - toroid in box problem
  var minR = 2.5, maxR = 4.9;
  if(state.R < minR){ state.R = minR; state.vel = Math.abs(state.vel)*0.3; }
  if(state.R > maxR){ state.R = maxR; state.vel = -Math.abs(state.vel)*0.5; }

  // minor radius breathes with major
  state.minorR = 0.58 + 0.22*Math.sin(state.time*0.8) + 0.12*(state.R/homeostasisR -1) + 0.1*Math.cos(state.time*1.4);
  state.minorR = Math.max(0.4, Math.min(1.2, state.minorR));

  // box scale reaction
  tmpBoxScale = 1 + overlap*0.06 + Math.abs(state.vel)*0.01;

  // determine mode
  var absVel = Math.abs(state.vel);
  if(absVel < 0.022){
    status.mode='HOMEOSTATIC';
  }else if(state.vel>0){
    status.mode='EXPANDING';
  }else{
    status.mode='CONTRACTING';
  }
  if(state.R > 4.42 && status.mode==='EXPANDING'){
    status.winner='torus';
  }else if(state.R < 2.72 && status.mode==='CONTRACTING'){
    status.winner='void';
  }else if(absVel<0.05 && Math.abs(state.R - homeostasisR)<0.35){
    status.winner='none';
  }

  // ripple within bound - post-resonance ripple from v115
  var delta = state.R - state.homeostasisR;
  var rippleWithinBound = Math.abs(delta) < 1.0 && Math.abs(state.vel) < 0.8;
  return {overlap:overlap, voidPush:voidPush, expansionPush:expansionPush, delta:delta, rippleWithinBound:rippleWithinBound};
}

// HUD elements
var toroidStats = document.getElementById('toroidStats');
var rippleStat = document.getElementById('rippleStat');
var voidStats = document.getElementById('voidStats');
var voidDetail = document.getElementById('voidDetail');
var statusDot = document.getElementById('statusDot');
var statusText = document.getElementById('statusText');
var winnerText = document.getElementById('winnerText');
var ladderCanvas = document.getElementById('ladder');
var ladderCtx = ladderCanvas.getContext('2d');

function drawLadder(R, overlap, vel){
  var w=ladderCanvas.width, h=ladderCanvas.height;
  ladderCtx.clearRect(0,0,w,h);
  // bg
  ladderCtx.fillStyle='rgba(10,13,28,0.9)';
  ladderCtx.fillRect(0,0,w,h);
  // grid lines
  var steps=10;
  for(var i=0;i<=steps;i++){
    var x = (i/steps)*w;
    ladderCtx.fillStyle = i===5 ? 'rgba(120,240,177,0.22)' : 'rgba(148,166,198,0.08)';
    ladderCtx.fillRect(x,0,1,h);
  }
  // wall
  ladderCtx.fillStyle='rgba(148,166,198,0.32)';
  ladderCtx.fillRect(w-2,0,2,h);
  // homeostasis line
  var homeX = (3.5/5)*w;
  ladderCtx.fillStyle='rgba(120,240,177,0.7)';
  ladderCtx.fillRect(homeX,0,1.5,h);
  // current R
  var currX = (R/5)*w;
  // pressure gradient
  var grad = ladderCtx.createLinearGradient(0,0,w,0);
  grad.addColorStop(0,'rgba(67,232,255,0.0)');
  grad.addColorStop(0.5,'rgba(67,232,255,0.18)');
  grad.addColorStop(0.85,'rgba(255,107,122,0.25)');
  grad.addColorStop(1,'rgba(255,107,122,0.55)');
  ladderCtx.fillStyle=grad;
  ladderCtx.fillRect(0,h*0.18,w,h*0.64);
  // R marker
  ladderCtx.beginPath();
  ladderCtx.arc(currX, h*0.5, 8, 0, Math.PI*2);
  ladderCtx.fillStyle= vel>0 ? '#43E8FF' : vel<0 ? '#FF6B7A' : '#78F0B1';
  ladderCtx.shadowColor=vel>0 ? '#43E8FF' : vel<0 ? '#FF6B7A' : '#78F0B1';
  ladderCtx.shadowBlur=12;
  ladderCtx.fill();
  ladderCtx.shadowBlur=0;
  // overlap zone
  if(overlap>0){
    var wallX = w-6;
    var overW = Math.min(w, overlap*70);
    ladderCtx.fillStyle='rgba(255,107,122,0.35)';
    ladderCtx.fillRect(wallX-overW, h*0.2, overW, h*0.6);
  }
  // label
  ladderCtx.fillStyle='rgba(230,234,245,0.85)';
  ladderCtx.font='10px ui-monospace, monospace';
  ladderCtx.fillText('R='+R.toFixed(2), Math.min(w-48, currX+12), 14);
}

function updateHUD(info){
  toroidStats.textContent = 'R='+state.R.toFixed(2)+'  r='+state.minorR.toFixed(2)+'  V='+state.vel.toFixed(2)+'  E='+(state.expansionRate*0.95).toFixed(2)+'x';
  rippleStat.textContent = 'rippleWithinBound: '+(info.rippleWithinBound?'true':'false')+' — Δ='+info.delta.toFixed(2)+'  home='+state.homeostasisR.toFixed(2);
  rippleStat.style.color = info.rippleWithinBound ? 'var(--green)' : 'var(--red)';
  voidStats.textContent = 'pushback = '+info.voidPush.toFixed(2)+' kPa (arb)';
  voidDetail.textContent = 'k='+state.voidK.toFixed(2)+'  overlap='+info.overlap.toFixed(2)+'  wall=5.0';

  var mode= status.mode;
  var dotColor = mode==='EXPANDING' ? 'var(--cyan)' : mode==='CONTRACTING' ? 'var(--red)' : 'var(--green)';
  statusDot.style.background=dotColor;
  statusDot.style.boxShadow='0 0 10px '+dotColor;
  if(mode==='HOMEOSTATIC'){
    statusText.textContent='HOMEOSTATIC — ripple locked';
    statusText.style.color='var(--green)';
  }else if(mode==='EXPANDING'){
    statusText.textContent='EXPANDING — mandelbrot front growing';
    statusText.style.color='var(--cyan)';
  }else{
    statusText.textContent='CONTRACTING — void winning locally';
    statusText.style.color='var(--red)';
  }
  if(status.winner==='torus'){
    winnerText.textContent='winner: torus — breach imminent';
    winnerText.style.color='var(--yellow)';
  }else if(status.winner==='void'){
    winnerText.textContent='winner: void — collapse to core';
    winnerText.style.color='var(--red)';
  }else{
    winnerText.textContent='no winner yet — balanced';
    winnerText.style.color='var(--muted)';
  }

  drawLadder(state.R, info.overlap, state.vel);

  // color shift torus
  var targetHex = mode==='EXPANDING' ? 0x43E8FF : mode==='CONTRACTING' ? 0xFF6B7A : 0x78F0B1;
  torusMat.emissive.setHex(targetHex);
  torusMat.emissiveIntensity = mode==='HOMEOSTATIC' ? 0.34 : 0.42;
  glowMat.color.setHex(targetHex);
  glowMat.opacity = 0.10 + Math.abs(state.vel)*0.06 + info.overlap*0.12;
}

var lastTime = performance.now();
var frame=0;
function animate(){
  requestAnimationFrame(animate);
  var now=performance.now();
  var dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime=now;

  var info = updatePhysics(dt);
  rebuildTorus();

  // box reaction
  box.scale.set(tmpBoxScale, tmpBoxScale, 1 + (tmpBoxScale-1)*0.35);
  boxHelper.update();

  // rotate torus slowly
  torus.rotation.z += dt*0.18 + Math.abs(state.vel)*0.02;
  torus.rotation.x = Math.sin(state.time*0.22)*0.15;
  glow.rotation.copy(torus.rotation);

  // void particles push
  var pos = partGeo.attributes.position.array;
  for(var i=0;i<partCount;i++){
    var px=pos[i*3], py=pos[i*3+1];
    var dist = Math.sqrt(px*px + py*py);
    var targetDist = 5.0 + info.overlap*1.2 + state.R*0.25;
    if(dist < targetDist){
      var ang = Math.atan2(py,px);
      var push = (targetDist - dist)*0.08 + 0.02;
      pos[i*3] += Math.cos(ang)*push;
      pos[i*3+1] += Math.sin(ang)*push;
    }
    // drift
    pos[i*3] += partVel[i*3];
    pos[i*3+1] += partVel[i*3+1];
    pos[i*3+2] += partVel[i*3+2];
    // wrap z
    if(Math.abs(pos[i*3+2])>4) pos[i*3+2]*=-0.8;
  }
  partGeo.attributes.position.needsUpdate=true;
  partMat.opacity = 0.28 + info.overlap*0.18;

  if(controls){ controls.update(); }
  else { camera.lookAt(0,0,0); }

  renderer.render(scene, camera);

  // occasional mandelbrot refresh for alive feel - every 90 frames
  frame++;
  if(frame % 90 === 0){
    renderMandelbrotToCanvas(texCanvas, mandelIter, mandelZoom, mandelOffX + Math.sin(state.time*0.1)*0.05, mandelOffY, state.time);
    mandelTexture.needsUpdate=true;
  }
  if(frame % 30 === 0){
    updateHUD(info);
  }
}
animate();

var slK = document.getElementById('slK');

  state.damping = parseFloat(e.target.value);

  renderMandelbrotToCanvas(texCanvas, mandelIter, mandelZoom, mandelOffX, mandelOffY, state.time);
  mandelTexture.needsUpdate=true;
});

document.getElementById('btnReset').addEventListener('click', function(){
  state.R = homeostasisR;
  state.vel=0;
  state.expansionRate=1.20;
  state.voidK=0.85;
  state.damping=0.38;
  slExp.value=1.20; valExp.textContent='1.20';
  slK.value=0.85; valK.textContent='0.85';
  slDamp.value=0.38; valDamp.textContent='0.38';
  status.winner='none';
});
document.getElementById('btnPulse').addEventListener('click', function(){
  state.vel += 0.9 + Math.random()*0.4;
  state.expansionRate = Math.min(2.5, state.expansionRate+0.25);
  slExp.value=state.expansionRate; valExp.textContent=state.expansionRate.toFixed(2);
});
document.getElementById('btnContract').addEventListener('click', function(){
