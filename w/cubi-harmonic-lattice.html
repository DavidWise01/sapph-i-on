<!DOCTYPE html>
<html lang="en">
<head><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta charset="UTF-8">
<title>Harmonic Crystal Lattice — Analytical Cubi Homeostasis</title>
<style>
  :root {
    --bg:       #090912;
    --bg2:      #0e0e1a;
    --fg:       #e2e8f0;
    --muted:    #64748b;
    --cyan:     #22d3ee;
    --cyan-dim: #0891b2;
    --amber:    #f59e0b;
    --red:      #ef4444;
    --blue:     #3b82f6;
    --green:    #22c55e;
    --gold:     #eab308;
    --gray:     #475569;
    --line:     #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
                font-family: 'Segoe UI', system-ui, sans-serif; }
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 10;
    display: flex; align-items: center; padding: 0 16px; gap: 10px;
    background: linear-gradient(180deg, #0f0f1f 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  #title { font-weight: 700; color: var(--cyan); letter-spacing: 0.05em; white-space: nowrap; }
  #subtitle { color: var(--muted); }
  .sep { color: var(--line); }
  .chonks { display: flex; gap: 4px; margin-left: 8px; }
  .chonk {
    padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
    background: var(--line); color: var(--muted); border: 1px solid transparent;
    transition: all 0.2s;
  }
  .chonk.active { color: var(--cyan); border-color: var(--cyan-dim); background: rgba(34,211,238,0.08); }
  .chonk.j02 { color: var(--amber); }
  .chonk.j02.active { border-color: var(--amber); background: rgba(245,158,11,0.08); }
  .chonk.j04 { color: var(--green); }
  .chonk.j04.active { border-color: var(--green); background: rgba(34,197,94,0.08); }
  .chonk.j05 { color: var(--gold); }
  .chonk.j05.active { border-color: var(--gold); background: rgba(234,179,8,0.08); }
  .chonk.j06 { color: var(--red); }
  .chonk.j06.active { border-color: var(--red); background: rgba(239,68,68,0.08); }
  .chonk.j07 { color: #a78bfa; }
  .chonk.j07.active { border-color: #a78bfa; background: rgba(167,139,250,0.08); }
  #controls { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .ctrl-btn {
    background: var(--line); color: var(--fg); border: 1px solid #334155;
    padding: 4px 12px; border-radius: 4px; font-size: 11px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .ctrl-btn:hover { background: #1e293b; border-color: var(--cyan-dim); }
  .ctrl-btn.on { background: rgba(34,211,238,0.1); border-color: var(--cyan); color: var(--cyan); }
  .slider-wrap { display: flex; align-items: center; gap: 6px; }
  .slider-wrap label { font-size: 11px; color: var(--muted); }
  input[type=range] { width: 80px; accent-color: var(--cyan); }
  #canvas-wrap { position: fixed; top: 44px; bottom: 26px; left: 0; right: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #statusbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 26px; z-index: 10;
    display: flex; align-items: center; padding: 0 14px; gap: 18px;
    background: var(--bg2); border-top: 1px solid var(--line);
    font-size: 11px; color: var(--muted); font-family: 'Cascadia Mono', 'Consolas', monospace;
  }
  .stat { white-space: nowrap; }
  .stat b { color: var(--cyan); font-weight: 600; }
  .stat.amber b { color: var(--amber); }
  .stat.green b { color: var(--green); }
  .stat.red b { color: var(--red); }
  .stat.gold b { color: var(--gold); }
  .stat.purple b { color: #a78bfa; }
  #help {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--muted); text-align: center; pointer-events: none;
    opacity: 0.7; letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<div id="topbar">
  <span id="title">⟐ ANALYTICAL CUBI HOMEOSTASIS</span>
  <span id="subtitle">· harmonic crystal lattice</span>
  <span class="sep">|</span>
  <span class="stat">CUBI <b>17</b></span>
  <span class="sep">|</span>
  <div class="chonks">
    <span class="chonk j01" data-j="01">J01</span>
    <span class="chonk j02" data-j="02">J02</span>
    <span class="chonk j03" data-j="03">J03</span>
    <span class="chonk j04" data-j="04">J04</span>
    <span class="chonk j05" data-j="05">J05</span>
    <span class="chonk j06" data-j="06">J06</span>
    <span class="chonk j07" data-j="07">J07</span>
  </div>
  <div id="controls">
    <div class="slider-wrap">
      <label>speed</label>
      <input type="range" id="speed" min="1" max="30" value="10">
      <span id="speed-val" style="font-size:11px;color:var(--muted);width:24px;text-align:right">10</span>
    </div>
    <button class="ctrl-btn on" id="consensus-toggle">consensus ON</button>
    <button class="ctrl-btn" id="reset-btn">reset</button>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="cv"></canvas>
</div>

<div id="statusbar">
  <span class="stat">t = <b id="st-t">0.000</b></span>
  <span class="stat">avg disp = <b id="st-disp">0.000</b></span>
  <span class="stat amber">consensus ratio = <b id="st-cratio">0.000</b></span>
  <span class="stat green">homeostasis = <b id="st-ho">—</b></span>
  <span class="stat gold">sampled = <b id="st-samp">—</b></span>
  <span class="stat purple">locked = <b id="st-locked">0</b>/17</span>
</div>

<div id="help">click a node to displace it · drag to rotate · consensus gates the lattice</div>

<script>
'use strict';

// ─── J01: signed geometry ────────────────────────────────────────────────────
const CUBI = 17;
function signedDist(i, j) { return i - j; }

// ─── J02: primitive 3/2/1 ────────────────────────────────────────────────────
function flay321(p) { return p.output; }
function primitiveReady(p) { return p.resonance === true && p.witness === true; }

// ─── J03: three-stage ────────────────────────────────────────────────────────
function transform3(s) {
  return { input: s.input, transformed: s.transformed,
           output: s.output, witness: s.witness };
}
function run3(s) { return transform3(s).output; }

// ─── J04: two-observer gate ───────────────────────────────────────────────────
function observersAgree(o) { return o.resonance && o.witness; }

// ─── J05: 2-of-3 consensus ────────────────────────────────────────────────────
function accept2of3(w0, w1, w2) {
  return (w0 && w1) || (w0 && w2) || (w1 && w2);
}
function J05(output, w0, w1, w2) {
  return accept2of3(w0, w1, w2) ? output : null;
}

// ─── J06: bounded recovery ────────────────────────────────────────────────────
function stepToward(anchor, state) {
  if (state < anchor) return state + 1;
  if (state > anchor) return state - 1;
  return state;
}

// ─── J07: integrated homeostasis ──────────────────────────────────────────────
function homeostasis(anchor, state, w0, w1, w2) {
  if (!accept2of3(w0, w1, w2)) return null;
  return stepToward(anchor, state);
}

// ─── Theorem assertions (19) — run at load ────────────────────────────────────
(function verifyTheorems() {
  let fails = [];
  // J01
  if (signedDist(0, 0) !== 0) fails.push('J01 signedDist_self');
  if (signedDist(5, 12) !== -signedDist(12, 5)) fails.push('J01 antisymmetric');
  if (signedDist(0, 1) !== -1) fails.push('J01 zero_one');
  if (signedDist(1, 0) !== 1) fails.push('J01 one_zero');
  for (let i = 0; i < CUBI; i++)
    for (let j = 0; j < CUBI; j++)
      if (signedDist(i, j) !== -signedDist(j, i)) fails.push('J01_ready');
  // J02
  const p = { input: 42, transformed: 84, output: 99, resonance: true, witness: true };
  if (flay321(p) !== p.output) fails.push('J02 flay321');
  if (!primitiveReady(p)) fails.push('J02 primitiveReady');
  // J03
  const s = { input: 10, transformed: 20, output: 30, witness: false };
  if (run3(s) !== s.output) fails.push('J03 run3');
  if (transform3(s).witness !== s.witness) fails.push('J03 transform3_preserves');
  // J04
  const o = { resonance: true, witness: true };
  if (observersAgree(o) !== true) fails.push('J04 agree_true');
  if (observersAgree({ resonance: false, witness: true }) !== false) fails.push('J04 require_res');
  if (observersAgree({ resonance: true, witness: false }) !== false) fails.push('J04 require_wit');
  // J05
  if (accept2of3(true, true, true) !== true) fails.push('J05 all_yes');
  if (accept2of3(true, true, false) !== true) fails.push('J05 one_no');
  if (accept2of3(true, false, false) !== false) fails.push('J05 two_no');
  if (J05(42, true, true, false) !== 42) fails.push('J05 accepts');
  if (J05(42, true, false, false) !== null) fails.push('J05 rejects');
  // J06
  if (stepToward(10, 3) !== 4) fails.push('J06 below');
  if (stepToward(10, 15) !== 14) fails.push('J06 above');
  if (stepToward(10, 10) !== 10) fails.push('J06 at_anchor');
  // J07
  if (homeostasis(10, 7, true, true, false) !== 8) fails.push('J07 consensus');
  if (homeostasis(10, 7, true, false, false) !== null) fails.push('J07 no_consensus');
  if (homeostasis(10, 10, true, true, true) !== 10) fails.push('J07 at_anchor');

  if (fails.length === 0) {
    console.log('%c✓ 19/19 theorems verified (definitional, Python mirror + JS assert)',
                'color:#22d3ee;font-weight:600');
  } else {
    console.error('%c✗ ' + fails.length + ' theorem failures:', 'color:#ef4444;font-weight:600');
    fails.forEach(f => console.error('  -', f));
  }
})();

// ─── Lattice state ────────────────────────────────────────────────────────────
const lattice = [];
for (let i = 0; i < CUBI; i++) {
  lattice.push({
    id: i,
    anchor: i,
    state: i,           // current displayed displacement (= anchor initially)
    phase: 0,
    prim: {             // J02 Primitive321
      input: i, transformed: i, output: i, resonance: true, witness: true
    },
    obs: {              // J04 Observers
      resonance: true, witness: true
    },
    staged: {           // J03 Stage3
      input: i, transformed: i, output: i, witness: true
    },
    hovered: false,
  });
}

// Helix positions for 3D render (not part of Lean defs — visual layout)
// node i → (cx * cos(theta), i * spacing, cx * sin(theta))
const HELIX_RADIUS = 1.6;
const SPACING = 0.7;
const TURNS = 2.6;
function helixPos(i) {
  const theta = (i / CUBI) * TURNS * 2 * Math.PI;
  return {
    x: HELIX_RADIUS * Math.cos(theta),
    y: (i - (CUBI - 1) / 2) * SPACING,
    z: HELIX_RADIUS * Math.sin(theta),
    angle: theta,
  };
}
lattice.forEach(n => { const p = helixPos(n.id); n.x = p.x; n.y = p.y; n.z = p.z; n.angle = p.angle; });

// ─── Global sim state ─────────────────────────────────────────────────────────
const G = {
  t: 0,
  consensusCount: 0,
  totalSteps: 0,
  consensusRatio: 0,
  lastConsensus: null,   // last J07 result
  sampled: [0, 0, 0],   // J05 observer indices this step
  consensusOn: true,
  speed: 10,             // stepToward steps per second
  lockedCount: 0,
};

// ─── Canvas setup ─────────────────────────────────────────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
let azimuth = 0.5;       // yaw (rad)
let elevation = 0.35;    // pitch (rad)
let autoRotate = true;
let dragging = false, lastMX = 0, lastMY = 0;

function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * (window.devicePixelRatio || 1);
  cv.height = H * (window.devicePixelRatio || 1);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
}
window.addEventListener('resize', resize);

// ─── 3D transforms ────────────────────────────────────────────────────────────
const tmp = { x:0, y:0, z:0 };
function rotateY(x, y, z, a) {
  const c = Math.cos(a), s = Math.sin(a);
  tmp.x = x * c + z * s;
  tmp.y = y;
  tmp.z = -x * s + z * c;
  return tmp;
}
function rotateX(x, y, z, a) {
  const c = Math.cos(a), s = Math.sin(a);
  tmp.x = x;
  tmp.y = y * c - z * s;
  tmp.z = y * s + z * c;
  return tmp;
}
function project(x, y, z) {
  const fov = 3.2, d = 6.0;
  const px = rotateY(x, y, z, azimuth);
  const py = rotateX(px.x, px.y, px.z, elevation);
  const scale = fov / (d + py.z);
  return { sx: W/2 + py.x * scale * 90, sy: H/2 - py.y * scale * 90, scale };
}

// ─── Color helpers ────────────────────────────────────────────────────────────
function edgeColor(sd) {
  // sd in [-16, +16], map to hue: blue (220) → gray (0) → red (0)
  const t = sd / CUBI;  // -1..+1
  const abs = Math.abs(t);
  if (abs < 0.03) return '#334155';
  const hue = t < 0 ? 210 + (1 - abs) * 20 : 10 - (1 - abs) * 10;
  const sat = 60 + abs * 40;
  const lit = 45 + abs * 20;
  return `hsl(${hue}, ${sat}%, ${lit}%)`;
}
function nodeColor(state, anchor) {
  const d = Math.abs(state - anchor);
  if (d === 0) return '#22d3ee';          // at anchor — cyan (homeostatic)
  if (d <= 2) return '#22e0a0';           // close — green
  if (d <= 5) return '#f59e0b';           // mid — amber
  return '#ef4444';                       // far — red
}

// ─── Draw edge between two 3D points ─────────────────────────────────────────
function drawEdge(a, b, sd, lw) {
  const pa = project(a.x, a.y, a.z);
  const pb = project(b.x, b.y, b.z);
  ctx.beginPath();
  ctx.moveTo(pa.sx, pa.sy);
  ctx.lineTo(pb.sx, pb.sy);
  ctx.strokeStyle = edgeColor(sd);
  ctx.lineWidth = lw || 0.8;
  ctx.globalAlpha = 0.35 + Math.abs(sd) / CUBI * 0.35;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ─── Draw node ────────────────────────────────────────────────────────────────
function drawNode(n, proj) {
  const r = 7 + proj.scale * 2;
  const col = nodeColor(n.state, n.anchor);
  const isSampled = G.sampled.includes(n.id);
  const isLocked = n.prim.resonance && n.prim.witness && G.consensusOn;

  // glow
  const grd = ctx.createRadialGradient(proj.sx, proj.sy, 0, proj.sx, proj.sy, r * 2.5);
  grd.addColorStop(0, col + '66');
  grd.addColorStop(1, col + '00');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(proj.sx, proj.sy, r * 2.5, 0, 2 * Math.PI);
  ctx.fill();

  // pulse for sampled observers (J05)
  if (isSampled) {
    const pulse = 0.5 + 0.5 * Math.sin(G.t * 8);
    ctx.fillStyle = `rgba(234,179,8,${0.15 + pulse * 0.2})`;
    ctx.beginPath();
    ctx.arc(proj.sx, proj.sy, r * 3 + pulse * 5, 0, 2 * Math.PI);
    ctx.fill();
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.6 + pulse * 0.4;
    ctx.beginPath();
    ctx.arc(proj.sx, proj.sy, r * 2 + pulse * 3, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // node body
  ctx.beginPath();
  ctx.arc(proj.sx, proj.sy, r, 0, 2 * Math.PI);
  ctx.fillStyle = col;
  ctx.fill();
  ctx.strokeStyle = n.hovered ? '#ffffff' : (isLocked ? '#fff' : 'rgba(255,255,255,0.3)');
  ctx.lineWidth = n.hovered ? 2 : 1;
  ctx.stroke();

  // J02 resonance+witness = inner dot
  if (n.prim.resonance && n.prim.witness) {
    ctx.beginPath();
    ctx.arc(proj.sx, proj.sy, r * 0.38, 0, 2 * Math.PI);
    ctx.fillStyle = '#22c55e';
    ctx.fill();
  }

  // J03 three-stage pipeline bar (bottom of node)
  const barY = proj.sy + r + 3;
  const barW = 14, barH = 2.5;
  // input (left, blue), transform (mid, amber), output (right, green)
  [[proj.sx - barW, '#3b82f6'], [proj.sx - barW/2, '#f59e0b'], [proj.sx, '#22c55e']]
    .forEach(([bx, c]) => {
      ctx.fillStyle = c;
      ctx.globalAlpha = 0.8;
      ctx.fillRect(bx, barY, barW/3, barH);
    });
  ctx.globalAlpha = 1;

  // J04 gate indicator (above node)
  if (n.prim.resonance && n.prim.witness) {
    // gate icon: two rings
    ctx.strokeStyle = '#22c55e';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(proj.sx, proj.sy - r - 5, 3, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(proj.sx + 2.5, proj.sy - r - 5, 3, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(proj.sx, proj.sy - r - 5, 3, 0, 2 * Math.PI);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // node id label
  ctx.fillStyle = '#94a3b8';
  ctx.font = '8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(n.id, proj.sx, proj.sy + r + 11);
}

// ─── Render ────────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0a18');
  bg.addColorStop(1, '#111122');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Grid hint (faint equispaced lines)
  ctx.strokeStyle = 'rgba(30,41,59,0.5)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 12; i++) {
    const y = (i / 12) * H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  for (let i = 0; i < 16; i++) {
    const x = (i / 16) * W;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Project all nodes
  const projs = lattice.map(n => project(n.x, n.y, n.z));

  // ── Edges: chain (adjacent) colored by signedDist (J01) ────────────────────
  for (let i = 0; i < CUBI - 1; i++) {
    drawEdge(lattice[i], lattice[i+1], signedDist(i, i+1), 1.2);
  }
  // Cross-brace edges (sparse — every 4th) for lattice feel
  for (let i = 0; i < CUBI - 4; i += 4) {
    const sd = signedDist(i, i+4);
    drawEdge(lattice[i], lattice[i+4], sd, 0.6);
  }

  // ── Nodes ───────────────────────────────────────────────────────────────────
  for (let i = 0; i < CUBI; i++) {
    drawNode(lattice[i], projs[i]);
  }

  // ── Consensus meter (J05) in canvas — bottom-left ──────────────────────────
  const cr = G.consensusRatio;
  const barX = 14, barY = H - 44, barW = 140, barH = 10;
  ctx.fillStyle = 'rgba(15,15,25,0.8)';
  ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
  // fill
  const fillCol = cr > 0.66 ? '#22c55e' : (cr > 0.33 ? '#f59e0b' : '#ef4444');
  ctx.fillStyle = fillCol;
  ctx.globalAlpha = 0.8;
  ctx.fillRect(barX, barY, barW * cr, barH);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '9px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('consensus ' + (cr * 100).toFixed(0) + '%', barX, barY - 3);
  // sampled observer markers
  G.sampled.forEach(si => {
    const x = barX + (si / CUBI) * barW;
    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.arc(x, barY + barH/2, 2.5, 0, 2 * Math.PI);
    ctx.fill();
  });
}

// ─── Simulation step (J06 + J05 + J07) ────────────────────────────────────────
function simStep() {
  if (!G.consensusOn) {
    G.totalSteps++;
    return;  // consensus gate closed — no update, lattice holds
  }

  // 1. J05: sample 3 random observers
  const obs = [];
  for (let k = 0; k < 3; k++) {
    const idx = Math.floor(Math.random() * CUBI);
    obs.push(idx);
    G.sampled[k] = idx;
  }
  const w = obs.map(idx => {
    const n = lattice[idx];
    return n.prim.resonance && n.prim.witness;
  });

  // 2. J05 consensus gate
  const agreed = accept2of3(w[0], w[1], w[2]);

  // 3. J07: homeostasis — commit stepToward only if consensus holds
  let anyChanged = false;
  if (agreed) {
    for (const n of lattice) {
      const next = stepToward(n.anchor, n.state);
      if (next !== n.state) anyChanged = true;
      n.state = next;
      n.prim.output = next;
      n.prim.witness = (next === n.anchor);
      n.staged.output = next;
      n.staged.witness = (next === n.anchor);
    }
    G.lastConsensus = lattice[0].state;  // some value
  } else {
    G.lastConsensus = null;
  }

  // 4. J06 step count and consensus ratio
  G.totalSteps++;
  if (agreed) G.consensusCount++;
  G.consensusRatio = G.consensusCount / Math.max(1, G.totalSteps);

  // 5. Phase advance (visual oscillation)
  for (const n of lattice) {
    n.phase += 0.025;
    // small visual wobble on top of stepToward
    // (stepToward is the actual dynamics; phase is rendering only)
  }

  // 6. Update J02 resonance (always true when active) + witness
  for (const n of lattice) {
    n.prim.resonance = true;  // oscillator is active
    n.prim.witness = (n.state === n.anchor);
    n.obs.resonance = true;
    n.obs.witness = (n.state === n.anchor);
  }

  // 7. Locked count (J04 observersAgree per node)
  G.lockedCount = lattice.filter(n => observersAgree(n.obs)).length;

  G.t += 1;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
let lastStepTime = 0;
let stepAccum = 0;
function loop(ts) {
  if (!lastStepTime) lastStepTime = ts;
  const dt = (ts - lastStepTime) / 1000;
  lastStepTime = ts;

  // Auto-rotate
  if (autoRotate && !dragging) {
    azimuth += dt * 0.18;
  }

  // Step simulation at speed Hz
  stepAccum += dt * G.speed;
  while (stepAccum >= 1) {
    simStep();
    stepAccum -= 1;
  }

  // Update DOM status bar
  document.getElementById('st-t').textContent = G.t.toFixed(0);
  const avgDisp = lattice.reduce((s, n) => s + Math.abs(n.state - n.anchor), 0) / CUBI;
  document.getElementById('st-disp').textContent = avgDisp.toFixed(3);
  document.getElementById('st-cratio').textContent = (G.consensusRatio * 100).toFixed(1) + '%';
  const hoEl = document.getElementById('st-ho');
  if (G.lastConsensus !== null) {
    hoEl.textContent = '✓ stepToward committed';
    hoEl.style.color = 'var(--green)';
  } else {
    hoEl.textContent = '✗ consensus hold';
    hoEl.style.color = 'var(--red)';
  }
  document.getElementById('st-samp').textContent = G.sampled.join(',');
  document.getElementById('st-locked').textContent = G.lockedCount;

  // Update chonk active states (visual wiring in topbar)
  document.querySelectorAll('.chonk').forEach(el => {
    const j = parseInt(el.dataset.j);
    el.classList.toggle('active', true);  // all always active in live lattice
  });

  render();
  requestAnimationFrame(loop);
}

// ─── Mouse interaction ────────────────────────────────────────────────────────
cv.addEventListener('mousedown', e => { dragging = true; lastMX = e.clientX; lastMY = e.clientY; });
window.addEventListener('mouseup', () => { dragging = false; });
cv.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  azimuth += dx * 0.005;
  elevation = Math.max(-1.2, Math.min(1.2, elevation + dy * 0.005));
  lastMX = e.clientX; lastMY = e.clientY;
});

// Touch
cv.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
  }
}, { passive: true });
cv.addEventListener('touchend', () => { dragging = false; });
cv.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastMX;
  const dy = e.touches[0].clientY - lastMY;
  azimuth += dx * 0.005;
  elevation = Math.max(-1.2, Math.min(1.2, elevation + dy * 0.005));
  lastMX = e.touches[0].clientX; lastMY = e.touches[0].clientY;
}, { passive: true });

// Click a node → displace it (J06 recovery test)
cv.addEventListener('click', e => {
  if (dragging) return;
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  for (const n of lattice) {
    const p = project(n.x, n.y, n.z);
    const dx = mx - p.sx, dy = my - p.sy;
    if (dx * dx + dy * dy < 14 * 14) {
      // displace node: move state away from anchor by random amount
      const dir = n.state >= n.anchor ? -1 : 1;
      const amt = Math.floor(Math.random() * 5) + 2;
      n.state = Math.max(0, Math.min(CUBI - 1, n.anchor + dir * amt));
      n.prim.output = n.state;
      n.prim.witness = false;
      n.staged.output = n.state;
      n.staged.witness = false;
      // flash chonk highlight
      document.querySelector('.chonk.j06').style.transition = 'none';
      document.querySelector('.chonk.j06').style.background = 'rgba(239,68,68,0.3)';
      document.querySelector('.chonk.j06').style.borderColor = '#ef4444';
      setTimeout(() => {
        document.querySelector('.chonk.j06').style.transition = 'all 0.3s';
      }, 100);
      return;
    }
  }
});

// ─── Controls ──────────────────────────────────────────────────────────────────
document.getElementById('consensus-toggle').addEventListener('click', function() {
  G.consensusOn = !G.consensusOn;
  this.textContent = G.consensusOn ? 'consensus ON' : 'consensus OFF';
  this.classList.toggle('on', G.consensusOn);
  if (!G.consensusOn) {
    document.querySelector('.chonk.j05').style.background = 'rgba(239,68,68,0.15)';
    document.querySelector('.chonk.j05').style.borderColor = '#ef4444';
    document.querySelector('.chonk.j05').style.color = '#ef4444';
  } else {
    document.querySelector('.chonk.j05').style.background = '';
    document.querySelector('.chonk.j05').style.borderColor = '';
    document.querySelector('.chonk.j05').style.color = '';
  }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  for (const n of lattice) {
    n.state = n.anchor;
    n.prim.output = n.anchor;
    n.prim.witness = true;
    n.staged.output = n.anchor;
    n.staged.witness = true;
  }
  G.t = 0; G.consensusCount = 0; G.totalSteps = 0; G.consensusRatio = 0;
  G.lastConsensus = null;
  document.querySelector('.chonk.j06').style.transition = 'none';
  document.querySelector('.chonk.j06').style.background = 'rgba(34,197,94,0.12)';
  document.querySelector('.chonk.j06').style.borderColor = '#22c55e';
  document.querySelector('.chonk.j06').style.color = '#22c55e';
  setTimeout(() => {
    document.querySelector('.chonk.j06').style.transition = 'all 0.3s';
    document.querySelector('.chonk.j06').style.background = '';
    document.querySelector('.chonk.j06').style.borderColor = '';
    document.querySelector('.chonk.j06').style.color = '';
  }, 200);
});

const speedEl = document.getElementById('speed');
speedEl.addEventListener('input', () => {
  G.speed = parseInt(speedEl.value);
  document.getElementById('speed-val').textContent = G.speed;
});

// ─── Keyboard ──────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') document.getElementById('reset-btn').click();
  if (e.key === 'c' || e.key === 'C') document.getElementById('consensus-toggle').click();
  if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); autoRotate = !autoRotate; }
});

// ─── Start ─────────────────────────────────────────────────────────────────────
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
