</style></head><body><h1>ASCII RECORD &middot; READER</h1>
<div class="n">an ASIDE. the instrument is the other file. column width:</div>
<div><button onclick="w(74)">74</button><button onclick="w(64)">64</button><button onclick="w(48)">48</button><button onclick="w(38)">38</button><button onclick="w(0)">RAW</button></div>
<pre id="p"></pre><script>
const SRC="THE NEST ~~> A GUEST CARRIED INSIDE A CLOSED SHELL            AZURITE\n==========================================================================\nLEGEND  [LIT] measured  [AMB] constructed / my reading  [DED] tested and disproven\n        (*) caught by a control   [!] planted, MUST refuse\n\nSPINE\n--------------------------------------------------------------------------\nH2 nested in N( e , o , n , ) ~~> two readings, one built, one left standing open\n  reading A  NOTATION -- a container with three named slots and a TRAILING COMMA,\n             a fourth slot left empty, and H2 goes in it.  [NOT BUILT. NOT FILLED.]\n  reading B  PHYSICS  -- hydrogen dissolved as a trace inside a neon host.\n             accepted name: a PENNING MIXTURE.  mechanism: PENNING IONISATION.\n             built, because it is the FIX for the problem the last build ended on.\n\nTHE PROBLEM IT FIXES   [LIT]\n--------------------------------------------------------------------------\n   gas        volts to STRIKE     eV to RUN\n   hydrogen        302.8            15.84\n   neon            269.6            21.56\n   each gas is good at the half the other is bad at.\n   STRIKE IN THE NEON, WORK IN THE HYDROGEN.  the nest buys both ends.\n\nTHE SHELF.  everything turns on ONE number.   [LIT]\n--------------------------------------------------------------------------\n   neon's lowest METASTABLE sits at 16.6191 eV\n\n                           channel     needs    surplus   verdict\n                       H -> H+ + e   13.5984    +3.0207   GOES\n                     H2 -> H2+ + e   15.4259    +1.1932   GOES\n                  H2 -> H + H+ + e   18.0760    -1.4569   BLOCKED\n                     Ne -> Ne+ + e   21.5645    -4.9454   BLOCKED\n\n   ABOVE both guests.  BELOW itself.  BELOW the destructive channel.\n   the reservoir can pay the guest, cannot pay itself, and cannot pay enough to\n   tear the guest apart.  THREE CONSTRAINTS SATISFIED BY ONE LEVEL.\n\n  [!] TWO PLANTED CONTROLS, both must REFUSE:\n      Ne* ionising NEON ............ surplus -4.9454 eV   REFUSED\n      Ne* tearing H2 apart ......... surplus -1.4569 eV   REFUSED\n      if either had said YES the ladder is wrong and everything below it too.\n      (*) both held.\n\nTHE BATTERY -- why it must be a METASTABLE   [LIT]\n--------------------------------------------------------------------------\n   resonant   1s4, 1s2   ~1e-8 s   radiates and is gone\n   metastable 1s5, 1s3   ~1e-1 s   cannot radiate to ground, so it WAITS\n   ratio                  1e7 x\n   ten million times longer.  THAT is the storage element.  a resonant level would\n   emit its photon and be empty long before it ever found a hydrogen molecule.\n   no metastable, no nest.\n\nHOW MUCH GUEST   [AMB]\n--------------------------------------------------------------------------\n   steady-state [Ne*] falls as 1/(1 + K x) because the guest quenches it.\n   ion production goes as x * [Ne*], so the product SATURATES.\n   that is a two-term toy, NOT a discharge model.  the real 'too much dopant goes\n   cold' comes from POWER BALANCE, which is not modelled and I am not pretending.\n   classic Penning mixes run 0.1 - 1% dopant.  'nested' is the right word: the guest\n   is INSIDE, SMALL, and CARRIED.\n\nTHE RECEIPT -- the colour is the accounting   [LIT]\n--------------------------------------------------------------------------\n   every handoff spends ONE neon excitation.  that is one orange photon NEVER emitted.\n   the tube does not merely gain pink -- it LOSES orange, in the same collision.\n     Ne strongest 640.2 nm orange-red   ->  quenched\n     H-alpha 656.3 + H-beta 486.1       ->  pink\n   the two line sets OVERLAP at 640-660 nm, which is why the eye reads a WALK\n   and not a switch.\n\nWHAT THE NEST COSTS\n--------------------------------------------------------------------------\n   gain: lower strike voltage      pay: the host's light\n   gain: cheaper running species   pay: a second gas to keep pure\n   gain: a stored-energy buffer    pay: quenching that scales with dose\n\nDISSENT -- RECORDED, NOT RESOLVED\n--------------------------------------------------------------------------\n   W1 read 'nested' as DISSOLVED INSIDE, as a trace.  that is one meaning.\n   his notation N( e , o , n , ) reads more like CONTAINMENT IN A SLOT -- one thing\n   held in a named position inside another, which is what he has meant by nesting\n   all session: 7||4, 4^3 * 3^3, the satellite periods, the 3x3x3.\n   THOSE ARE NOT THE SAME OPERATION.\n     a Penning mixture is STATISTICAL -- the guest is everywhere and nowhere, at 0.1%.\n     a slot nest is POSITIONAL -- the guest is somewhere specific.\n   W5 will not merge them.  if he meant the second one, this build answered a\n   question he did not ask, and the answer is still true but it is not his.\n\nSCOREBOARD\n--------------------------------------------------------------------------\n   faults caught by a control ... 2   both blocked Penning channels refused on demand\n   faults caught by a person .... 1   he supplied the nest; the instrument only priced it\n   retracted stamps ............. 0   this pass\n   gaps left open ............... 6   the trailing comma ; the ball ; the .25% ;\n                                      the cheat ; cradling ; the mother\n\nWHAT THIS BOARD CANNOT SEE\n--------------------------------------------------------------------------\n   it cannot see cross sections.  every rate here is a THRESHOLD comparison -- can the\n   energy be paid, yes or no.  whether a collision ACTUALLY transfers depends on cross\n   sections and on how long the two things are near each other, and none of that is\n   in this build.  energetically allowed is not the same as fast.\n";
function w(c){const el=document.getElementById('p');
 if(!c){el.textContent=SRC;el.style.fontSize='11px';return;}
 el.style.fontSize=(c>=74?11:c>=64?10.5:c>=48?9.5:8.5)+'px';
 el.textContent=SRC.split('\n').map(l=>{if(l.length<=c)return l;
  const o=[];let s=l;while(s.length>c){let k=s.lastIndexOf(' ',c);if(k<c*0.5)k=c;o.push(s.slice(0,k));s='  '+s.slice(k).trimStart();}
  o.push(s);return o.join('\n');}).join('\n');}
w(74);
</script></body></html>
