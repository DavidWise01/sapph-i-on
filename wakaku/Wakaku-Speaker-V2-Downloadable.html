import time
import json
from dataclasses import dataclass

TIMING = {
    "5": {"ms": 90, "hz": 495, "mouth": 0.3, "color": "blue"},
    "7": {"ms": 160, "hz": 618.3, "mouth": 0.8, "color": "orange"},
    "0": {"ms": 200, "hz": 0, "mouth": 0.0, "color": "black", "rest": True},
}

@dataclass
class Receipt:
    bucket_id: str
    wakaku: str
    payload_hash: str
    ingress_ns: int
    seal: str

def bucket_id(parent: str, wakaku: str, payload: str, ingress_ns: int) -> str:
    """primitive kernel: bucket_id = sha256(parent+wakaku+payload+ingress)"""
    raw = f"{parent}|{wakaku}|{payload}|{ingress_ns}".encode()
    return hashlib.sha256(raw).hexdigest()

def receipt_seal(bucket: str, pattern: str) -> str:
    return hashlib.sha256(f"{bucket}::{pattern}::sings".encode()).hexdigest()[:16]

def make_receipt(parent: str, payload: str) -> Receipt:
    ingress = time.time_ns()
    bid = bucket_id(parent, PATTERN, payload, ingress)
    ph = hashlib.sha256(payload.encode()).hexdigest()[:16]
    seal = receipt_seal(bid, PATTERN)
    return Receipt(bucket_id=bid, wakaku=PATTERN, payload_hash=ph, ingress_ns=ingress, seal=seal)

            d = TIMING[c]
            # oscillator placeholder: in hardware would drive DAC @ d['hz']
            mouth = d['mouth'] * (0.05 if vacuum else 1.0)  # vacuum barely moves
            print(f" step {i:02d} [{c}] {d['ms']}ms @{d['hz']}Hz mouth={mouth:.2f} color={d['color']}")

    print("[kernel] sealed")

    timing_loop(iterations=2, vacuum=False)
    timing_loop(iterations=1, vacuum=True)
