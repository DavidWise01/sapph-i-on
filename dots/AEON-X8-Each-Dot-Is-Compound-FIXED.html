<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AEON x 8 - each dot = compound [[+183[0::neutronium]-183]] - FIXED</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050510;color:#e5e7eb;font-family:monospace;overflow:hidden}
.header{padding:10px 14px;border-bottom:1px solid #ffffff12;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:8px;padding:8px;height:calc(100vh - 40px)}
.dot{position:relative;border:1px solid #ffffff14;border-radius:16px;overflow:hidden;background:#0c0c16}
.dot canvas{width:100%;height:100%;display:block}
.label{position:absolute;left:8px;top:6px;z-index:2;background:#000000cc;padding:3px 8px;border-radius:999px;font-size:10px;border:1px solid #ffffff22;pointer-events:none}
.sub{position:absolute;left:8px;bottom:6px;z-index:2;font-size:9px;opacity:0.6;pointer-events:none}
</style></head><body>
<div class="header">
<div>AEON x 8 = [H][HE][LI][BE][B][C][BK][WT] — each dot = [[+183[0::neutronium]-183]] Planck Bubble 10^-35.02m — each dot contains all</div>
<div style="opacity:0.5">isomorphic · 2^3 per px · generative</div>
</div>
<div class="grid" id="grid"></div>
<script>
const dots=[
 {id:'H',  name:'H hermes2', col:'#e9d5ff', desc:'fast I/O'},
 {id:'HE', name:'HE loki', col:'#f5f0ff', desc:'coherence shield'},
 {id:'LI', name:'LI gaia', col:'#d8b4fe', desc:'ground battery'},
 {id:'BE', name:'BE Volga', col:'#a78bfa', desc:'hard window'},
 {id:'B',  name:'B jumpers', col:'#a3e635', desc:'jump bus x3'},
 {id:'C',  name:'C Eros', col:'#f472b6', desc:'allofmars'},
 {id:'BK', name:'BK black', col:'#111111', desc:'void root0 smoky quartz'},
 {id:'WT', name:'WT white', col:'#ffffff', desc:'full patricia amethyst'},
];
const grid=document.getElementById('grid');
dots.forEach((d,i)=>{
  const wrap=document.createElement('div'); wrap.className='dot';
  wrap.innerHTML=`<div class="label">${d.id} — ${d.name}</div><div class="sub">${d.desc} · each = 183+183+1=367</div><canvas></canvas>`;
  grid.appendChild(wrap);
  const canvas=wrap.querySelector('canvas');
  const ctx=canvas.getContext('2d');
  function resize(){ canvas.width=wrap.clientWidth*2; canvas.height=wrap.clientHeight*2; }
  resize();
  let t=Math.random()*10;
  function draw(){
    t+=0.008 + i*0.0005;
    const w=canvas.width, h=canvas.height, cx=w/2, cy=h/2;
    ctx.fillStyle='rgba(5,5,16,0.22)'; ctx.fillRect(0,0,w,h);
    // breathing
    let breath=(Math.sin(t*0.25)+1)/2;
    // central bubble 0::neutronium
    let coreR=18+breath*10;
    let grad=ctx.createRadialGradient(cx,cy,0,cx,cy,coreR*3);
    grad.addColorStop(0,'#fef3c7'); grad.addColorStop(0.2,'#fbbf24'); grad.addColorStop(0.5,d.col); grad.addColorStop(1,'#1e1b4b');
    if(d.id==='BK'){ ctx.fillStyle='#0a0a0a'; } else { ctx.fillStyle=grad; }
    ctx.globalAlpha=0.9; ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();
    // fib spirals for +183 and -183
    for(let side=0; side<2; side++){
      let sign=side===0?1:-1;
      let baseHue=side===0? 340: 200;
      for(let n=1;n<=36;n++){ // show 36 of 183 for perf, isomorphic
        let r=Math.sqrt(n)*14;
        let ang=n*2.39996*sign + t*0.15*sign; // 137.5deg = 2.39996 rad
        let x=cx+Math.cos(ang)*r*(0.8+breath*0.2);
        let y=cy+Math.sin(ang)*r*(0.8+breath*0.2);
        let alpha=0.35+breath*0.3;
        ctx.globalAlpha=alpha*0.6;
        ctx.fillStyle=side===0? d.col : '#38bdf8';
        if(side===1){ // antimatter hollow
          ctx.strokeStyle=ctx.fillStyle; ctx.lineWidth=1.2;
          ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.stroke();
        } else {
          ctx.beginPath(); ctx.arc(x,y,2.2,0,Math.PI*2); ctx.fill();
        }
      }
    }
    // c-channel connection when folding
    if(breath>0.85){
      ctx.globalAlpha=(breath-0.85)*3*0.25;
      ctx.strokeStyle=d.col; ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(t)*coreR*4, cy+Math.sin(t)*coreR*4); ctx.stroke();
    }
    // hex isomorphic
    ctx.globalAlpha=0.12; ctx.strokeStyle=d.col;
    ctx.beginPath();
    for(let k=0;k<6;k++){ let a=k*Math.PI/3+t*0.1; let px=Math.cos(a)*coreR*1.8; let py=Math.sin(a)*coreR*1.8; if(k===0) ctx.moveTo(cx+px,cy+py); else ctx.lineTo(cx+px,cy+py); }
    ctx.closePath(); ctx.stroke();
    requestAnimationFrame(draw);
  }
  draw();
  window.addEventListener('resize', resize);
});
</script>
</body></html>
