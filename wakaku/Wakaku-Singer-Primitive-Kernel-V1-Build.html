    assert pattern==WAKAKU_A+WAKAKU_00+WAKAKU_A
    assert WAKAKU_LEFT==WAKAKU_RIGHT==WAKAKU_A
    left,mid,right=pattern[:8],pattern[8:10],pattern[10:]
    steps=[{"i":i,"char":c,"timing":TIMING_MAP[c]} for i,c in enumerate(pattern)]
    return {"pattern":pattern,"A":WAKAKU_A,"00":WAKAKU_00,
            "left":left,"right":right,"is_palindrome":left==right,
            "symmetry":"A 00 A","steps":steps,"len":len(pattern)}

def timing_ms(pattern:str=WAKAKU_PATTERN)->int:
    return sum(TIMING_MAP[c][0] for c in pattern)  # 10*90 +6*160 +2*200 = 2260ms

def ingress(parent:ParentAnchor,wakaku:str=WAKAKU_PATTERN)->WakakuBucket:
    if parent.referent!="0011": raise ValueError("requires 0011")
    bid=sha256_obj({"parent":parent.fingerprint,"scale":SCALE,"wakaku":wakaku,"ingress":INGRESS})
    return WakakuBucket(VERSION,bid,parent,SCALE,wakaku)

def egress(bucket:WakakuBucket)->WakakuReceipt:
    payload={"version":VERSION,"primitive":PRIMITIVE,"bucket_id":bucket.bucket_id,
             "wakaku":bucket.wakaku,"ingress":INGRESS,"egress":EGRESS}
    return WakakuReceipt(VERSION,PRIMITIVE,bucket.bucket_id,bucket.wakaku,INGRESS,EGRESS,sha256_obj(payload))

def verify_receipt(r:WakakuReceipt)->bool:
    payload={"version":r.version,"primitive":r.primitive,"bucket_id":r.bucket_id,
             "wakaku":r.wakaku,"ingress":r.ingress,"egress":r.egress}
    return sha256_obj(payload)==r.seal and r.version==VERSION

def sing_sequence(pattern:str=WAKAKU_PATTERN):
    t=0; seq=[]
    for i,ch in enumerate(pattern):
        ms,freq,_=TIMING_MAP[ch]
        seq.append({"index":i,"char":ch,"t_start":t,"t_end":t+ms,"freq":freq,
                    "mouth":TIMING_MAP[ch][2],"label":f"{ch}= {ms}ms {freq}Hz"})
        t+=ms
    return seq

def wakaku_test():
    cells=16
    buckets=set(); receipts=set(); transitions=0
    for cell in range(cells):
        p=parent_anchor(cell)
        b=ingress(p)
        r=egress(b)
        assert verify_receipt(r)
        buckets.add(b.bucket_id); receipts.add(r.seal)
        transitions+=2
    parsed=parse_wakaku()
    total=timing_ms()
    return {"status":"0e / wakaku-v1 WAKAKU SINGER PASS",
            "version":VERSION,"pattern":WAKAKU_PATTERN,
            "cells":cells,"transitions":transitions,
            "unique_buckets":len(buckets),"unique_receipts":len(receipts),
            "symmetry":parsed["is_palindrome"],"left==right==A":parsed["left"]==parsed["right"]==WAKAKU_A,
            "timing_ms_per_loop":total,"total_ms_all_buckets":total*cells,
            "sequence":sing_sequence()}

if __name__=="__main__":
    print(json.dumps(wakaku_test(),indent=2))
