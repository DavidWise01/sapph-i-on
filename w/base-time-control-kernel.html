Base X v00.01

A symbolic seed kernel only. It makes no physical, biological, or
consciousness claim. The proof fixes the literal register:

* four named quads: a, b, c, d;
* four phases: 1, 2, 3, 4;
* five floors at 0, 15, 30, 45, and 60;
* a root that is pinned at home (0).
-/

namespace Oasis

inductive Quad where
  | a | b | c | d

inductive Phase where
  | one | two | three | four

inductive Floor where
  | one | two | three | four | five

inductive Pole where
  | p | n

def floorPosition : Floor → Nat
  | .one   => 0
  | .two   => 15
  | .three => 30
  | .four  => 45
  | .five  => 60

structure QuadFrame where
  a : Bool
  b : Bool
  c : Bool
  d : Bool

structure BaseX where
  frame      : QuadFrame
  activeQuad : Quad
  phase      : Phase
  floor      : Floor
  polarity   : Pole
  root       : Nat
  pinnedHome : root = 0

theorem rollRootBack (x : BaseX) : x.root = 0 := x.pinnedHome

theorem quadClosed (q : Quad) : q = .a ∨ q = .b ∨ q = .c ∨ q = .d := by
  cases q <;> simp

theorem phaseClosed (p : Phase) :
    p = .one ∨ p = .two ∨ p = .three ∨ p = .four := by
  cases p <;> simp

theorem floorClosed (f : Floor) :
    f = .one ∨ f = .two ∨ f = .three ∨ f = .four ∨ f = .five := by
  cases f <;> simp

theorem floorRegister :
    floorPosition .one = 0 ∧
    floorPosition .two = 15 ∧
    floorPosition .three = 30 ∧
    floorPosition .four = 45 ∧
    floorPosition .five = 60 := by
  decide

theorem floorSpacing :
    floorPosition .two - floorPosition .one = 15 ∧
    floorPosition .three - floorPosition .two = 15 ∧
    floorPosition .four - floorPosition .three = 15 ∧
    floorPosition .five - floorPosition .four = 15 := by
  decide

theorem baseXClosed (x : BaseX) : x.root = 0 ∧ floorPosition x.floor ≤ 60 := by
  constructor
  · exact rollRootBack x
  · cases x.floor <;> decide
