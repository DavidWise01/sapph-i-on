        .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#1c2530;border-top:1px solid #1c2530}
        .metric{background:#111a25;padding:10px 14px}
        .metric .k{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#67737f}
        .metric .v{font-family:'Space Mono',monospace;font-size:14px;color:#eef2f6;margin-top:2px}
        .metric .v b{color:#d8a84a}
        .metric .v em{color:#3fd0e0;font-style:normal}
        .controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:#0f1822;border-top:1px solid #1c2530;align-items:center}
        .btn{font-family:'Space Mono',monospace;font-size:11px;padding:7px 12px;border-radius:8px;border:1px solid #1e2a38;background:#162131;color:#c8d2de;cursor:pointer}
        .btn:hover{background:#1c2d42;color:#fff}
        .btn.primary{background:#d8a84a;color:#111;border-color:#d8a84a}
        .btn.primary:hover{background:#e6b85c}
        .speed{margin-left:auto;display:flex;gap:6px;align-items:center;font-family:'Space Mono',monospace;font-size:10px;color:#67737f}
        input[type=range]{accent-color:#3fd0e0}
        .status{padding:9px 14px;font-family:'Space Mono',monospace;font-size:10px;color:#67737f;background:#0e1721;border-top:1px solid #1c2530}
        .rail{max-height:620px;overflow:auto}
        .row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #151f2b;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer}
        .row:hover{background:rgba(63,208,224,.06)}
        .addr{color:#d8a84a}.val{color:#3fd0e0}
        .q{padding:2px 6px;border-radius:4px;font-size:10px}
        .q0{background:rgba(63,208,224,.13);color:#3fd0e0}.q1{background:rgba(216,168,74,.13);color:#d8a84a}.q2{background:rgba(192,132,252,.13);color:#c084fc}.q3{background:rgba(34,197,94,.13);color:#22c55e}
        .coherent{width:6px;height:6px;border-radius:50%;background:#22c55e;display:inline-block;margin-left:6px}
        .wakaku{display:flex;gap:4px;margin-top:8px}
        .wakaku span{flex:1;height:22px;display:grid;place-items:center;border-radius:6px;background:#162131;border:1px solid #1e2a38;font-family:'Space Mono',monospace;font-size:10px;color:#67737f}
        .wakaku span.on{background:#d8a84a;color:#111;border-color:#d8a84a;box-shadow:0 0 10px rgba(216,168,74,.4)}
        .progress{height:4px;background:#1c2530;border-radius:999px;overflow:hidden;margin-top:8px}
        .progress i{display:block;height:100%;background:linear-gradient(90deg,#3fd0e0,#d8a84a);width:0%}
        .cubits{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
        @media(max-width:900px){.cubits{grid-template-columns:repeat(2,1fr)}}
        .cubit{background:rgba(255,255,255,.02);border:1px solid #1c2530;border-radius:10px;padding:10px 12px}
        .cubit .k{font-family:'Space Mono',monospace;font-size:9px;text-transform:uppercase;color:#67737f}
        .cubit .v{font-family:'Space Mono',monospace;font-size:11px;color:#aab6c2;margin-top:4px;line-height:1.5}
        .cubit b{color:#eef2f6;font-weight:400}
        .claim{background:rgba(216,168,74,.06);border-left:3px solid #d8a84a;padding:10px 14px;margin-top:12px;border-radius:0 8px 8px 0;font-family:'Space Mono',monospace;font-size:11px;color:#d8a84a}
        .seal{margin-top:12px;padding:10px 14px;background:rgba(120,80,220,.05);border:1px solid rgba(120,80,220,.18);border-radius:8px;font-family:'Space Mono',monospace;font-size:10px;color:#aab6c2;line-height:1.6}
        .seal b{color:#c084fc}
