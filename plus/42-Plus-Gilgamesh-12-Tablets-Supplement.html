"Ring 0: clay cradle",summary:"Aruru creates Enkidu from clay — hairy-bodied, brawny, raised by animals. Horns? Gazelle eat with him. Clay is older than gold — primitive [[ - [0.g.0]+[L.0.d.0] ]]. Hairy wild man, pure matter.",connection:"Ring 0 origin. Links to Temples 1 & 8: E-abzu (clay, watery abyss where clay is shaped) and E-hursag-kalama (mother earth, Ninhursag birth). Enkidu is literally temple clay.",linkedTemples:[1,8,20,37],cuneiform:"\uD808\uDC8D\uD808\uDE48\uD808\uDF13\uD808\uDC7A \uD808\uDDFD \uD808\uDC2D",quote:"You, Enkidu, born in wilderness — hairy all your body"},{n:45,tabletNo:"III",tabletIdx:3,title:"Shamhat civilizes Enkidu",episode:"Civilization via Temple",ring:"Ring 2: initiation",summary:"Temple prostitute Shamhat sent to tame Enkidu. Six days seven nights. Animals flee. Enkidu becomes human, learns bread, beer, speech. Shamhat — priestess of Inanna — is Enheduanna's lineage.",connection:"Direct Enheduanna link. Shamhat = Inanna priestess. Temple 4, 16, 26, 31 all Inanna of Uruk/Zabalam. Enheduanna was high priestess of this exact office. Civilization = temple initiation.",linkedTemples:[4,16,26,31,25],cuneiform:"\uD808\uDEA9\uD808\uDF11\uD808\uDE4E \uD808\uDE63\uD808\uDE28\uD808\uDF0D",quote:"Shamhat stripped off her robe and lay down — she taught him the work of women"},{n:46,tabletNo:"IV",tabletIdx:4,title:"Journey to Cedar Forest",episode:"Dream Interpretation",ring:"Ring 3: threshold",summary:"Gilgamesh and Enkidu prepare to journey to Cedar Forest. Elders warn. Enkidu has terrible dreams — fire, mountain, bull. Gilgamesh interprets them favorably. Dream work — first psychotherapy.",connection:"Dream interpretation = temple oracle function. Links to Temple 5 E-babbar (Utu, dreams) and Temple 2 E-kur (Enlil determines fates). Forest journey is pilgrimage.",linkedTemples:[2,5,23,3],cuneiform:"\uD808\uDD11\uD808\uDC8A\uD808\uDE48\uD808\uDE3E \uD808\uDF37 \uD808\uDC38",quote:"My friend, why are your eyes so full of tears? — Enkidu dreams"},{n:47,tabletNo:"V",tabletIdx:5,title:"Humbaba slaying",episode:"Forest as Temple",ring:"Ring 4: guardian slain",summary:"Cedar Forest guarded by Humbaba — seven radiances, terrible face of intestines. Forest itself is living temple. They cut cedars, kill guardian. Enlil rages. First deforestation myth.",connection:"Forest as temple — Temples 6 E-ninnu and 27 E-girsu (forest/cedar temples of Ningirsu). Cutting cedar for temple doors. Violence against sacred grove = desecration that will cost Enkidu.",linkedTemples:[6,27,28,2],cuneiform:"\uD808\uDD37\uD808\uDF1D\uD808\uDC40\uD808\uDC40 \uD808\uDC00\uD808\uDDC9\uD808\uDC8A",quote:"Humbaba's roar is the flood, his mouth is fire, his breath is death"},{n:48,tabletNo:"VI",tabletIdx:6,title:"Ishtar proposal rejected",episode:"Goddess Refused",ring:"Ring 5: goddess confrontation",summary:"Goddess Ishtar proposes marriage to Gilgamesh. He rejects — lists her lovers destroyed: Tammuz, shepherd, gardener Ishullanu. Ishtar = Inanna. Fury. Demands Bull of Heaven.",connection:"Crucial link. Ishtar = Inanna. Direct reference to Enheduanna's hymns 16, 26, 40 — Inanna of Zabalam, Inanna as queen of heaven, destroyer of lovers. Enheduanna's Inanna is this goddess. Gilgamesh rejects what Enheduanna adored.",linkedTemples:[10,16,26,40,4,31],cuneiform:"\uD808\uDC2D\uD808\uDE39 \uD808\uDEAD \uD808\uDD11\uD808\uDC86\uD808\uDE26",quote:"Come, Gilgamesh, be my bridegroom! To me grant your fruit!"},{n:49,tabletNo:"VII",tabletIdx:7,title:"Enkidu death sentence",episode:"Death — Nightmare",ring:"Ring 6: death arrives",summary:"Gods decide Enkidu must die for Humbaba and Bull. Enkidu awakes from nightmare — Anu, Enlil, Shamash judge him. Curses Shamhat then blesses her. Twelve days illness. Clay returns to clay.",connection:"Temple justice — divine assembly E-kur (Temple 2). Links to Temples 2, 12, 39 — Enlil's judgement. Enkidu's curse/blessing mirrors temple curse formulae in Enheduanna's hymns.",linkedTemples:[2,12,39,19],cuneiform:"\uD808\uDC8D\uD808\uDE48\uD808\uDF13\uD808\uDC7A \uD808\uDC40\uD808\uDF63 \uD808\uDD56",quote:"Enkidu's eyes filled with tears, his heart beat loudly — he lay down"},{n:50,tabletNo:"VIII",tabletIdx:8,title:"Gilgamesh grief",episode:"Profound Grief",ring:"Ring 7: lament",summary:"Gilgamesh laments Enkidu seven days, until worm falls from nose. 'My friend, my younger brother...' Covers him like bride, orders statues, mourns. First elegy. Refuses to bury — grief as transformation.",connection:"Lamentation genre invented here — later temple laments. Links to Temple 32 E-ganun-mah (Ningal, mourning goddess) and 38 E-dub-lal-mah. Enheduanna also wrote laments. Grief = opening to quest.",linkedTemples:[32,38,14,42],cuneiform:"\uD808\uDD11\uD808\uDC86\uD808\uDE26 \uD808\uDD46\uD808\uDF63 \uD808\uDC8D\uD808\uDE48\uD808\uDF13",quote:"May the elders of wide Uruk mourn you — may the bear, hyena, lion mourn you"},{n:51,tabletNo:"IX",tabletIdx:9,title:"Quest for immortality",episode:"Defeat Death Itself",ring:"Ring 8: quest begins",summary:"Gilgamesh dons lion skin, wanders wilderness. Seeks Utnapishtim who survived flood. Passes Mashu mountains — scorpion men guard. Real immortality is not escaping death but leaving wisdom, impact, transformation. City walls remain.",connection:"Quest = pilgrimage to all 42 temples. Links to Temple 1 E-abzu (primordial wisdom) and Temple 2 E-kur (fate). Gilgamesh must go beyond temple walls to find meaning.",linkedTemples:[1,2,3,22],cuneiform:"\uD808\uDD11\uD808\uDC86\uD808\uDE26 \uD808\uDE2A\uD808\uDC8A \uD808\uDC8D\uD808\uDE48\uD808\uDF13",quote:"I will go, I will wander the wilderness — for Enkidu my friend"},{n:52,tabletNo:"X",tabletIdx:10,title:"Shiduri tavern keeper",episode:"Wisdom of Present",ring:"Ring 9: tavern wisdom",summary:"Siduri/Shiduri, tavern keeper by sea, tells Gilgamesh: 'No permanence. Fill belly, make merry, cherish child, wash head.' — oldest philosophy of carpe diem. Life in present, not endless future. Then Urshanabi ferryman
