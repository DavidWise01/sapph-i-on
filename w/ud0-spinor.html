<script>
(function(){
var N=MAP.slugs.length,DM=MAP.dom;
var A=MAP.L[0],pts=[];
for(var i=0;i<N;i++){var v=[A[i*3]/127,A[i*3+1]/127,A[i*3+2]/127];var n=Math.hypot(v[0],v[1],v[2])||1;
  // close the sphere: include the antipode so it's a full spinor-able shell
  pts.push([v[0]/n,v[1]/n,v[2]/n]); pts.push([-v[0]/n,-v[1]/n,-v[2]/n]);}
var DMx=[];for(var i=0;i<N;i++){DMx.push(DM[i]);DMx.push(DM[i]);}
var M=pts.length;

var cv=document.getElementById('sp'),ctx=cv.getContext('2d');
var ang=0,auto=true,drag=false,px,py,manual=false,tiltX=-0.35;

function draw(){
  var g=size(),W=g.w,H=g.h,R=Math.min(W,H)*0.34;ctx.clearRect(0,0,W,H);
  var t=ang*Math.PI/180;                     // rotation angle
  var half=t/2;                              // SPINOR half-angle
  var phase=Math.cos(half);                  // e^{i t/2} real part: +1 at 0, -1 at 360, +1 at 720
  var cy=Math.cos(t),sy=Math.sin(t),cx=Math.cos(tiltX),sx=Math.sin(tiltX);
  // wire sphere (rotates at full angle — the SO(3) view)
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--rule');ctx.globalAlpha=.4;
  for(var a=0;a<6;a++){ctx.beginPath();for(var s=0;s<=40;s++){var th=s/40*Math.PI*2,ph=a/6*Math.PI;
    var p=[Math.cos(th)*Math.sin(ph),Math.cos(ph),Math.sin(th)*Math.sin(ph)];
    var x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1]*cx-z*sx;z=p[1]*sx+z*cx;
    var q=[W/2+x*R,H/2+y*R];s?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);}ctx.stroke();}
  ctx.globalAlpha=1;
  // points: position rotates at full angle; COLOR/amplitude carries half-angle phase
  var arr=[];
  for(var i=0;i<M;i++){var p=pts[i];
    var x=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1]*cx-z*sx;z=p[1]*sx+z*cx;
    arr.push({x:W/2+x*R,y:H/2+y*R,depth:z,i:i});}
  arr.sort(function(a,b){return a.depth-b.depth;});
  arr.forEach(function(o){
    var fog=(o.depth+1.2)/2.4;ctx.globalAlpha=Math.max(.25,Math.min(1,fog));
    // amplitude sign from the spinor phase tints toward teal(+) or coral(-)
    var mix=(phase+1)/2;   // 1 at home, 0 at 360°
    var h=(DMx[o.i]*37)%360;
    var base='hsl('+h+',45%,58%)';
    // blend base with the phase color
    ctx.fillStyle=mix>0.5? base : 'hsl(14,'+Math.round(30+40*(1-mix))+'%,'+Math.round(52-10*(1-mix))+'%)';
    var rr=2+1.4*Math.abs(phase);      // size pulses with |phase|
    ctx.fillRect(o.x-rr/2,o.y-rr/2,rr,rr);

  // belt/dirac string: a ribbon from center to pole that twists with half-angle
  drawBelt(W,H,R,t);
  // meters
  var deg=Math.round(ang)%720; if(deg<0)deg+=720;
  document.getElementById('ang').textContent=Math.round(ang%720)+'°';
  document.getElementById('dial').style.width=((ang%720)/720*100)+'%';
  var pv=document.getElementById('ph');pv.textContent=(phase>=0?'+':'')+phase.toFixed(2);
  pv.className='v'+(phase<0?' flip':'');
  var near360=Math.abs(((ang%720)+720)%720-360)<8;
  var near0=((ang%720)+720)%720<8||Math.abs(((ang%720))-720)<8;
  var stv=document.getElementById('st');
  if(near360){stv.textContent='inverted';stv.className='v flip';}
  else if(near0){stv.textContent='home';stv.className='v';}
  else{stv.textContent=phase>=0?'returning':'flipped';stv.className='v'+(phase<0?' flip':'');}
  document.getElementById('belt').textContent=
    'phase e^{iθ/2} = '+(phase>=0?'+':'')+phase.toFixed(3)+'  ·  '+
    (near360?'360° — looks home, secretly −1':near0&&ang>10?'720° — truly home':'θ/2 = '+Math.round(ang/2)+'°');
  if(auto&&!drag)ang+=0.6;
  requestAnimationFrame(draw);
}
function drawBelt(W,H,R,t){
  ctx.save();ctx.globalAlpha=.5;ctx.lineWidth=2;
  var seg=24;
  for(var s=0;s<seg;s++){
    var f=s/seg, y=H/2 - f*R*1.3;
    var tw=t*f;                       // twist accumulates — this is the belt trick

  'the closed ud0 sphere, driven as a spinor. the wire sphere and point positions rotate at the full angle θ (the SO(3) view — period 360°). '+
  'but the amplitude carries the half-angle phase e^{iθ/2} (the SU(2) view — period 720°): at 360° the phase is −1, so the sphere LOOKS home but its state is inverted (coral). '+
  'only at 720° do both return. the twisting ribbon is the Dirac belt — one full turn leaves it twisted, the second turn undoes it. that impossibility-of-untwisting-at-360° IS the spinor.';
