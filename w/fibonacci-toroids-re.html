<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<style>
  :root{
    --bg:#0A0D1C;
    --surface:rgba(16,21,42,.90);
    --surface-2:rgba(24,30,60,.92);
    --text:#EDF2FF;
    --muted:#94A6C6;
    --cyan:#43E8FF;
    --violet:#C977FF;
    --green:#78F0B1;
    --red:#FF6B7A;
    --yellow:#FFE28B;
    --blue:#82A7FF;
    --pink:#FF8FB0;
    --border:rgba(148,166,198,.14);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(67,232,255,.18), transparent 60%),
      radial-gradient(900px 500px at 85% 10%, rgba(201,119,255,.16), transparent 60%),
      radial-gradient(800px 400px at 50% 120%, rgba(120,240,177,.10), transparent 60%);
    pointer-events:none;z-index:0;
  }
  #app{
    position:relative;z-index:1;
    display:grid;grid-template-columns: 64.5% 35.5%;
    height:100vh;width:100vw;
  }
  #left{position:relative;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border);background:linear-gradient(180deg, rgba(10,13,28,.2), rgba(10,13,28,.6))}
  #canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden}
  #c{display:block;width:100%;height:100%}
  /* HUD */
  .hud{position:absolute;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none;z-index:5}
  .hud.top{top:12px}
  .hud.bottom{bottom:12px;flex-direction:column;align-items:stretch;pointer-events:auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    pointer-events:auto;
    background:var(--surface);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    padding:6px 10px;
    font-size:11px;letter-spacing:.02em;line-height:1;
    display:inline-flex;align-items:center;gap:6px;
    box-shadow: 0 4px 18px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .chip b{font-weight:700;color:var(--cyan)}
  .chip.muted{color:var(--muted)}
  .chip.live{border-color:rgba(67,232,255,.28)}
  .chip.warn{border-color:rgba(255,107,122,.28)}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .chip.warn .dot{background:var(--red);box-shadow:0 0 8px var(--red)}
  .chip.homeo .dot{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
  .panel-bar{
    background:var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px;
    display:flex;flex-direction:column;gap:10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .row.label{justify-content:space-between}
  .row .left{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{
    appearance:none;
    background:rgba(16,21,42,.8);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:7px 10px;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.03em;
    cursor:pointer;
    transition:.15s;
  }
  .btn:hover{border-color:rgba(67,232,255,.35);transform:translateY(-1px);background:rgba(24,30,60,.95)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(180deg, rgba(67,232,255,.22), rgba(67,232,255,.08));border-color:rgba(67,232,255,.4);color:#D6FAFF}
  .btn.danger{border-color:rgba(255,107,122,.35);color:#FFD2D6}
  .fibs{display:flex;gap:6px}
  .fib{
    min-width:38px;justify-content:center;
  }
  .fib[aria-pressed="true"]{
    background:var(--text);color:#0A0D1C;border-color:var(--text);
    box-shadow:0 0 0 2px rgba(237,242,255,.18), 0 4px 16px rgba(67,232,255,.25);
  }
  .sliders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:720px){.sliders{grid-template-columns:1fr}}
  .slider{
    display:flex;flex-direction:column;gap:4px;
    background:rgba(10,13,28,.55);border:1px solid rgba(148,166,198,.10);
    border-radius:10px;padding:8px 9px;
  }
  .slider label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .slider label span.val{color:var(--text)}
  input[type="range"]{
    width:100%;accent-color:var(--cyan);height:4px;
    background:linear-gradient(90deg, var(--cyan), var(--violet));
    border-radius:99px;appearance:none;outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);border:2px solid var(--bg);box-shadow:0 0 0 2px rgba(67,232,255,.3);
  }
  .status-text{
    font-size:10px;color:var(--muted);letter-spacing:.02em;line-height:1.4;
    padding:0 2px;
  }
  .status-text em{color:var(--cyan);font-style:normal}

  /* Right panel */
  #right{
    background:var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow:auto;
    padding:18px 18px 22px;
    border-left:1px solid var(--border);
  }
  #right::-webkit-scrollbar{width:8px}
  #right::-webkit-scrollbar-thumb{background:rgba(148,166,198,.18);border-radius:99px}
  h1{font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;font-weight:800}
  .subtitle{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin:18px 0 8px;font-weight:700}
  p{font-size:12.5px;line-height:1.65;color:#D7E2FF;margin:0 0 10px}
  p.muted{color:var(--muted)}
  .callout{
    border:1px dashed rgba(67,232,255,.22);
    background:rgba(67,232,255,.06);
    border-radius:12px;padding:10px 11px;margin:12px 0;
    font-size:11px;line-height:1.5;color:#CDEFFF;
  }
  table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:11px}
  th{color:var(--muted);text-align:left;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:10px;padding:6px 6px;border-bottom:1px solid var(--border)}
  td{padding:7px 6px;border-bottom:1px solid rgba(148,166,198,.08);color:var(--text)}
  td.num{font-variant-numeric:tabular-nums}
  tr.active td{background:rgba(67,232,255,.08)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
  .legend .chip{font-size:10px}
  .inline-code{font-family:var(--mono);background:rgba(148,166,198,.12);padding:1px 5px;border-radius:5px;font-size:11px;color:var(--yellow)}
  .sep{height:1px;background:var(--border);margin:14px 0}
  /* mobile */
  @media(max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100vh;overflow:auto}
    html,body{overflow:auto}
    #left{height:62vh;border-right:none;border-bottom:1px solid var(--border)}
    #right{border-left:none}
    .hud.top{top:8px;left:8px;right:8px}
    .hud.bottom{left:8px;right:8px;bottom:8px}
  }
</style>

<div id="app">
  <div id="left">
    <div id="canvas-wrap">
      <canvas id="c"></canvas>

      <div class="hud top">
        <div class="chips" id="chips"></div>
      </div>

      <div class="hud bottom">
        <div class="panel-bar">
          <div class="row label">
            <div class="left">
              <div class="fibs" id="fibs"></div>
            </div>
            <div class="left">
              <button class="btn primary" id="btn-replicate">Replicate → next fib</button>
              <button class="btn" id="btn-collapse">Collapse</button>
              <button class="btn" id="btn-random">Randomize Phases</button>
              <button class="btn danger" id="btn-crush">Trigger Void Crush</button>
            </div>
          </div>
          <div class="sliders" id="sliders"></div>
          <div class="status-text" id="status-text"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="right">
    <h1>Fibonacci Toroids — rev24</h1>
    <div class="subtitle">2, 3, 5, 8, 13 — the packing ladder inside a 14×14×4 sheet. Vacuum indigo lab.</div>

    <div class="kicker">Why Fibonacci appears</div>
    <p>Sunflower phyllotaxis uses the golden angle <span class="inline-code">137.5°</span>. Each new seed lands at <span class="inline-code">r ∝ √i, θ = i·137.5°</span>. That sequence minimizes overlap for any <em>N</em> without re-optimization — optimal circle packing in a confined sheet. Our galaxies are toroids, not points, so the same rule gives us a near-optimal non-overlapping start.</p>
    <p class="muted">We clamp to the wire box, then let homeostatic expansion + void repulsion + inter-galaxy competition run. Fibonacci N lets us see the transition: low N = stable, high N = frustrated, jammed.</p>

    <div class="callout">
      <b style="color:var(--cyan)">Homeostasis check:</b> <span id="callout-ripple">ripple = Σ|dR| + Σoverlaps</span>. If ripple stays < 0.18 for 1s → <span style="color:var(--yellow)">HOMEOSTATIC</span>. Breach while still expanding → that galaxy wins. All R &lt; 0.35 → VOID wins.
    </div>

    <div class="kicker">Live packing table</div>
    <table id="pack-table">
      <thead><tr><th>N</th><th>density</th><th>Σ vol</th><th>contacts</th><th>IE-analogue</th><th>state</th></tr></thead>
      <tbody></tbody>
    </table>

    <div class="legend">
      <span class="chip" style="color:var(--cyan)"><span class="dot" style="background:var(--cyan)"></span> R = major</span>
      <span class="chip" style="color:var(--violet)"><span class="dot" style="background:var(--violet)"></span> r = minor 0.18–0.35</span>
      <span class="chip" style="color:var(--red)"><span class="dot" style="background:var(--red)"></span> repulsion lines</span>
      <span class="chip"><span class="dot"></span> trail = positional memory</span>
    </div>

    <div class="sep"></div>

    <div class="kicker">How winner changes with N</div>
    <p><b>2–3 galaxies:</b> plenty of vacuum. System finds HOMEOSTATIC quickly. Void push is the only limiter. Volume grows, ripple decays.</p>
    <p><b>5 galaxies:</b> first contacts. Golden angle still clears, but competition reduces R by ~8%. Packing density ~0.09–0.14. Winner rarely emerges unless you crush.</p>
    <p><b>8 galaxies:</b> frustration onset. Central galaxy caged by 7 others. Inter-repulsion lines persistent. Homeostasis takes longer, requires damping.</p>
    <p><b>13 galaxies:</b> jammed sheet. This is the classic phyllotaxis magic number — one full turn of optimal packing. Total volume saturates, contacts ∝ N(N-1)/2 spikes. Void Crush almost always produces a breach winner; otherwise system flickers between EXPANDING/CONTRACTING.</p>

    <div class="kicker">Visual mapping</div>
    <p class="muted">Each torus: <span class="inline-code">MeshStandardMaterial</span> with Mandelbrot canvas texture (256²) + emissive + transparent 0.75, plus wire overlay at 1.02× scale opacity 0.15. Box is 14×14×4 wireframe at 0.2 opacity, #94A6C6. Outside particles flow inward during crush. Trails store 24 positions.</p>

    <div class="sep"></div>
    <p class="muted" style="font-size:10px">The Fibonacci ladder is the packing ladder — the visible band is drawn to scale. 24 radial, 48 tubular keeps 13 toroids at 60fps. Mandelbrot centers jitter per galaxy so color drift ≠ new texture.</p>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const chipsEl = document.getElementById('chips');
  const fibsEl = document.getElementById('fibs');
  const slidersEl = document.getElementById('sliders');
  const statusTextEl = document.getElementById('status-text');
  const packTableBody = document.querySelector('#pack-table tbody');

  // State
  const FIB = [2,3,5,8,13];
  let currentN = 8;
  const BOX = {hx:7, hy:7, hz:2}; // half extents, full 14x14x4
  const PALETTE = [0x43E8FF, 0xC977FF, 0xFFE28B, 0x78F0B1, 0x82A7FF, 0xFF8FB0, 0xFF9A5C, 0x8BFFDA, 0xFFD86B, 0x9AB4FF, 0xFF8FE1, 0x7CFFB2, 0xB18CFF];
  const PALETTE_CSS = ['#43E8FF','#C977FF','#FFE28B','#78F0B1','#82A7FF','#FF8FB0','#FF9A5C','#8BFFDA','#FFD86B','#9AB4FF','#FF8FE1','#7CFFB2','#B18CFF'];

  let scene, camera, renderer, boxMesh, lineGroup, trailGroup;
  let particleSystem;
  let galaxies = [];
  let clock = new THREE.Clock();
  let elapsed = 0;
  let ripple = 0;
  let homeostaticTimer = 0;
  let systemState = 'EXPANDING';
  let winner = null;
  let crushActive = false;
  let crushT = 0;
  let totalVolume = 0;

  const controls = {
    voidStiffness: 0.85,
    interRepulsion: 1.25,
    amplitude: 0.36,
    damping: 0.18
  };

  // Mandelbrot texture generator
  function makeMandelbrotCanvas(cx, cy, zoom){
    const size = 256;
    const cvs = document.createElement('canvas');
    cvs.width = size; cvs.height = size;
    const ctx = cvs.getContext('2d');
    const img = ctx.createImageData(size,size);
    const maxIter = 90;
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const mx = (x/size - 0.5)*3.5/zoom + cx;
        const my = (y/size - 0.5)*3.5/zoom + cy;
        let zx=0, zy=0, iter=0;
        while(zx*zx+zy*zy<4 && iter<maxIter){
          const xt = zx*zx - zy*zy + mx;
          zy = 2*zx*zy + my;
          zx = xt;
          iter++;
        }
        const idx = (y*size + x)*4;
        if(iter===maxIter){
          img.data[idx]=10; img.data[idx+1]=13; img.data[idx+2]=28; img.data[idx+3]=255;
        }else{
          const t = iter / maxIter;
          // palette mapping: cyan -> violet -> yellow
          const hue = 190 + t*90; // shift
          // convert via simple gradient
          const r = Math.floor(10 + 200*Math.pow(t,0.6) + 40*Math.sin(t*12));
          const g = Math.floor(20 + 220*Math.pow(t,0.7) );
          const b = Math.floor(80 + 175*(1-Math.pow(t,0.4)) );
          img.data[idx]= Math.max(0,Math.min(255,r));
          img.data[idx+1]= Math.max(0,Math.min(255,g));
          img.data[idx+2]= Math.max(0,Math.min(255,b));
          img.data[idx+3]=255;
        }
      }
    }
    ctx.putImageData(img,0,0);
    return cvs;
  }

  function makeTextureForIndex(i){
    const cx = -0.743 + (i%5)*0.08 + (Math.random()-0.5)*0.02;
    const cy = 0.131 + Math.floor(i/3)*0.06 + (Math.random()-0.5)*0.02;
    const zoom = 0.9 + Math.random()*1.2;
    const cvs = makeMandelbrotCanvas(cx, cy, zoom);
    const tex = new THREE.CanvasTexture(cvs);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1.2, 0.9);
    tex.needsUpdate = true;
    return tex;
  }

  function initThree(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color('#0A0D1C');
    scene.fog = new THREE.Fog('#0A0D1C', 18, 38);

    camera = new THREE.PerspectiveCamera(46, 1, 0.1, 100);
    camera.position.set(9.2, -8.5, 7.8);

    renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    // lights
    const amb = new THREE.AmbientLight(0x94A6C6, 0.65);
    scene.add(amb);
    const dir1 = new THREE.DirectionalLight(0xEDF2FF, 0.9);
    dir1.position.set(6, -4, 10);
    scene.add(dir1);
    const dir2 = new THREE.DirectionalLight(0x43E8FF, 0.55);
    dir2.position.set(-8, 8, 4);
    scene.add(dir2);
    const point = new THREE.PointLight(0xC977FF, 0.9, 22);
    point.position.set(0,0,5);
    scene.add(point);

    // box wireframe
    const boxGeo = new THREE.BoxGeometry(BOX.hx*2, BOX.hy*2, BOX.hz*2);
    const boxMat = new THREE.MeshBasicMaterial({color:0x94A6C6, wireframe:true, transparent:true, opacity:0.20});
    boxMesh = new THREE.Mesh(boxGeo, boxMat);
    scene.add(boxMesh);

    // faint inner box fill
    const boxFillGeo = new THREE.BoxGeometry(BOX.hx*2*0.995, BOX.hy*2*0.995, BOX.hz*2*0.995);
    const boxFillMat = new THREE.MeshBasicMaterial({color:0x10152A, transparent:true, opacity:0.18, side:THREE.BackSide});
    const boxFill = new THREE.Mesh(boxFillGeo, boxFillMat);
    scene.add(boxFill);

    lineGroup = new THREE.Group();
    scene.add(lineGroup);
    trailGroup = new THREE.Group();
    scene.add(trailGroup);

    // void particles outside box that flow inward on crush
    const pCount = 420;
    const pGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(pCount*3);
    const velocities = new Float32Array(pCount*3);
    for(let i=0;i<pCount;i++){
      // random outside box but within 14-18
      const side = Math.floor(Math.random()*6);
      let x,y,z;
      if(side<2){ x = (Math.random()-0.5)*24; y = (Math.random()<0.5? -1:1)*(BOX.hy+0.5+Math.random()*4); z=(Math.random()-0.5)*6; }
      else if(side<4){ x = (Math.random()<0.5? -1:1)*(BOX.hx+0.5+Math.random()*4); y=(Math.random()-0.5)*24; z=(Math.random()-0.5)*6; }
      else { x=(Math.random()-0.5)*20; y=(Math.random()-0.5)*20; z=(Math.random()<0.5? -1:1)*(BOX.hz+0.5+Math.random()*3); }
      positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
      velocities[i*3]= -x*0.01; velocities[i*3+1]= -y*0.01; velocities[i*3+2]= -z*0.01;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    pGeo.setAttribute('velocity', new THREE.BufferAttribute(velocities,3));
    const pMat = new THREE.PointsMaterial({color:0x94A6C6, size:0.06, transparent:true, opacity:0.32, sizeAttenuation:true});
    particleSystem = new THREE.Points(pGeo, pMat);
    scene.add(particleSystem);

    // mouse orbit (simple)
    let isDragging=false, lastX=0, lastY=0, yaw= -0.72, pitch=0.62, dist=18.5;
    function updateCam(){
      const x = dist*Math.cos(pitch)*Math.cos(yaw);
      const y = dist*Math.cos(pitch)*Math.sin(yaw);
      const z = dist*Math.sin(pitch);
      camera.position.set(x,y,z);
      camera.lookAt(0,0,0);
    }
    updateCam();
    canvas.addEventListener('pointerdown', e=>{ isDragging=true; lastX=e.clientX; lastY=e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointerup', ()=>{ isDragging=false; });
    canvas.addEventListener('pointermove', e=>{
      if(!isDragging) return;
      const dx = e.clientX-lastX; const dy = e.clientY-lastY;
      yaw += dx*0.005; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy*0.004));
      lastX=e.clientX; lastY=e.clientY; updateCam();
    });
    canvas.addEventListener('wheel', e=>{
      e.preventDefault();
      dist = Math.max(9, Math.min(32, dist + e.deltaY*0.01));
      updateCam();
    }, {passive:false});

    window.addEventListener('resize', ()=>{
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
      camera.aspect = canvas.clientWidth / canvas.clientHeight;
      camera.updateProjectionMatrix();
    });
  }

  function clearGalaxies(){
    galaxies.forEach(g=>{
      scene.remove(g.group);
      if(g.trailLine) scene.remove(g.trailLine);
    });
    // clear trail group
    while(trailGroup.children.length) trailGroup.remove(trailGroup.children[0]);
    while(lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
    galaxies=[];
    homeostaticTimer=0;
    winner=null;
    systemState='EXPANDING';
    crushActive=false; crushT=0;
    boxMesh.scale.set(1,1,1);
    particleSystem.material.opacity=0.32;
    if(particleSystem.material.color) particleSystem.material.color.setHex(0x94A6C6);
  }

  function buildGalaxies(N){
    clearGalaxies();
    elapsed=0;
    clock.start();
    const golden = 137.5 * Math.PI/180;

    for(let i=0;i<N;i++){
      const radius = Math.sqrt(i+0.5)*1.8;
      const angle = i * golden;
      let x = radius*Math.cos(angle);
      let y = radius*Math.sin(angle);
      let z = (Math.random()-0.5)*0.8;

      const major = 0.8 + Math.random()*0.8; // 0.8-1.6
      const minor = 0.18 + Math.random()*0.17; // 0.18-0.35
      const phase = Math.random()*Math.PI*2;
      const freq = 0.55 + Math.random()*0.9;

      // clamp inside
      const maxXY = BOX.hx - (major+minor) - 0.18;
      const maxZ = BOX.hz - (major+minor) - 0.12;
      x = Math.max(-maxXY, Math.min(maxXY, x));
      y = Math.max(-maxXY, Math.min(maxXY, y));
      z = Math.max(-maxZ, Math.min(maxZ, z));

      const geo = new THREE.TorusGeometry(major, minor, 24, 48);
      const tex = makeTextureForIndex(i);
      const color = PALETTE[i % PALETTE.length];
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: tex,
        emissive: color,
        emissiveIntensity: 0.28,
        emissiveMap: tex,
        transparent:true,
        opacity:0.75,
        roughness:0.38,
        metalness:0.18,
      });
      const mesh = new THREE.Mesh(geo, mat);
      // orient each slightly differently to show torus sheet behavior
      mesh.rotation.x = (Math.random()-0.5)*0.35;
      mesh.rotation.y = (Math.random()-0.5)*0.35;

      const wireGeo = new THREE.TorusGeometry(major*1.02, minor*1.02, 16, 32);
      const wireMat = new THREE.MeshBasicMaterial({color: color, wireframe:true, transparent:true, opacity:0.14});
      const wire = new THREE.Mesh(wireGeo, wireMat);

      const group = new THREE.Group();
      group.add(mesh);
      group.add(wire);
      group.position.set(x,y,z);
      // gentle tilt so sheet visible
      group.rotation.z = (Math.random()-0.5)*0.2;

      scene.add(group);

      const R0 = 1.1 + Math.sin(phase)*0.16; // base homeostatic

      galaxies.push({
        idx:i,
        group,
        mesh,
        wire,
        baseMajor: major,
        r: minor,
        R0,
        phase,
        freq,
        currentR: major, // start at geometry major
        color,
        cssColor: PALETTE_CSS[i % PALETTE_CSS.length],
        trailPositions: [],
        trailLine: null,
        dR:0
      });
    }
    currentN = N;
    updateFibsUI();
    updatePackTable();
  }

  function updateFibsUI(){
    fibsEl.innerHTML='';
    FIB.forEach(n=>{
      const b=document.createElement('button');
      b.className='btn fib';
      b.textContent=n.toString();
      b.setAttribute('aria-pressed', n===currentN ? 'true':'false');
      b.onclick=()=>{ buildGalaxies(n); };
      fibsEl.appendChild(b);
    });
  }

  function buildSliders(){
    const defs = [
      {key:'voidStiffness', label:'void stiffness', min:0.1, max:2.0, step:0.05},
      {key:'interRepulsion', label:'inter-galaxy repulsion', min:0.1, max:3.0, step:0.05},
      {key:'amplitude', label:'expansion amplitude', min:0.05, max:1.2, step:0.02},
      {key:'damping', label:'damping', min:0.0, max:0.9, step:0.02},
    ];
    slidersEl.innerHTML='';
    defs.forEach(d=>{
      const wrap=document.createElement('div'); wrap.className='slider';
      const lab=document.createElement('label');
      const name=document.createElement('span'); name.textContent=d.label;
      const val=document.createElement('span'); val.className='val'; val.textContent=controls[d.key].toFixed(2);
      lab.appendChild(name); lab.appendChild(val);
      const input=document.createElement('input'); input.type='range'; input.min=d.min; input.max=d.max; input.step=d.step; input.value=controls[d.key];
      input.addEventListener('input', ()=>{
        controls[d.key]=parseFloat(input.value);
        val.textContent=controls[d.key].toFixed(2);
      });
      wrap.appendChild(lab); wrap.appendChild(input);
      slidersEl.appendChild(wrap);
    });
  }

  function updateChips(){
    const density = totalVolume / (BOX.hx*2 * BOX.hy*2 * BOX.hz*2);
    const rippleBound = ripple < 0.18;
    chipsEl.innerHTML='';

    const makeChip = (html, cls='')=>{
      const el=document.createElement('div'); el.className='chip '+cls; el.innerHTML=html; return el;
    };

    chipsEl.appendChild(makeChip('<span class="dot"></span> <b>'+currentN+'</b> galaxies','live'));
    chipsEl.appendChild(makeChip('Σ vol <b>'+totalVolume.toFixed(2)+'</b>','muted'));
    chipsEl.appendChild(makeChip('density <b>'+(density*100).toFixed(1)+'%</b>','muted'));
    chipsEl.appendChild(makeChip('ripple <b>'+ripple.toFixed(3)+'</b> '+(rippleBound?'≤ bound':' > bound'), rippleBound?'':'warn'));
    let stateClass = systemState.includes('WINNER')?'warn': systemState==='HOMEOSTATIC'?'homeo':'live';
    chipsEl.appendChild(makeChip('<span class="dot"></span> '+systemState, stateClass));

    // per galaxy mini chips
    galaxies.forEach((g,i)=>{
      const el=document.createElement('div'); el.className='chip';
      el.style.borderColor = g.cssColor+'55';
      el.innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:'+g.cssColor+';display:inline-block;box-shadow:0 0 6px '+g.cssColor+'"></span> G'+(i+1)+' R '+g.currentR.toFixed(2);
      chipsEl.appendChild(el);
    });
  }

  function updatePackTable(){
    if(!packTableBody) return;
    packTableBody.innerHTML='';
    FIB.forEach(n=>{
      const tr=document.createElement('tr');
      if(n===currentN) tr.classList.add('active');
      // approximate metrics for each N (if not current, estimate)
      let density, vol, contacts, ie, state;
      if(n===currentN){
        density = (totalVolume / 784);
        vol = totalVolume;
        // count contacts from last frame approximation: number of pairs with dist<threshold
        let c=0;
        for(let i=0;i<galaxies.length;i++) for(let j=i+1;j<galaxies.length;j++){
          const d=galaxies[i].group.position.distanceTo(galaxies[j].group.position);
          if(d < galaxies[i].currentR + galaxies[j].currentR + 0.6) c++;
        }
        contacts=c;
        ie = n*(n-1)/2 + Math.floor(n*1.618); // mode counts analogue
        state = systemState;
      }else{
        // rough projection using packing theory: density ~ N * avg torus vol / box
        const avgVol = 2*Math.PI*Math.PI*1.15*0.26*0.26;
        vol = avgVol * n * (n<=5?1: n<=8?0.92:0.84);
        density = vol/784;
        contacts = Math.floor(n*(n-1)/4);
        ie = n*(n-1)/2 + Math.floor(n*1.618);
        state = n<=3?'HOMEOSTATIC': n<=5?'EXPANDING': n<=8?'FRUSTRATED':'JAMMED';
      }
      tr.innerHTML = '<td>'+n+'</td><td class="num">'+(density*100).toFixed(1)+'%</td><td class="num">'+vol.toFixed(2)+'</td><td class="num">'+contacts+'</td><td class="num">'+ie+'</td><td>'+state+'</td>';
      packTableBody.appendChild(tr);
    });
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    if(galaxies.length===0){ renderer.render(scene,camera); return; }
    elapsed += dt;

    if(crushActive){
      crushT += dt*0.85;
      const k = Math.min(1, crushT);
      // compress box visual to 0.62 scale over 2 sec then hold
      const targetScale = 1 - 0.38 * (1 - Math.exp(-k*1.8));
      boxMesh.scale.set(targetScale, targetScale, 0.7+0.3*targetScale);
      // particle opacity up
      particleSystem.material.opacity = 0.32 + k*0.45;
      particleSystem.material.color.setHex(0xFF6B7A);
      // increase void stiffness temporarily
      // move particles inward
      const pos = particleSystem.geometry.attributes.position;
      const vel = particleSystem.geometry.attributes.velocity;
      for(let i=0;i<pos.count;i++){
        const ix=i*3;
        // lerp toward center accelerated
        pos.array[ix] += ( -pos.array[ix]*0.6 - pos.array[ix])*dt * (1.5+k*2.0);
        pos.array[ix+1] += ( -pos.array[ix+1]*0.6 - pos.array[ix+1])*dt * (1.5+k*2.0);
        pos.array[ix+2] += ( -pos.array[ix+2]*0.6 - pos.array[ix+2])*dt * (1.5+k*2.0);
        // add inward velocity
        pos.array[ix] += vel.array[ix]*dt*5*k;
        pos.array[ix+1] += vel.array[ix+1]*dt*5*k;
        pos.array[ix+2] += vel.array[ix+2]*dt*5*k;
      }
      pos.needsUpdate=true;
      if(k>2.2){ crushActive=false; }
    }

    totalVolume = 0;
    ripple = 0;
    let totalOverlap = 0;

    // phase 1: compute target R
    galaxies.forEach(g=>{
      const dampingFactor = Math.exp(-controls.damping * elapsed * 0.28);
      const targetR = g.R0 + controls.amplitude * Math.sin(elapsed * g.freq + g.phase) * dampingFactor;
      const dR = targetR - g.currentR;
      g.dR = dR;
      // smooth chase
      g.currentR += dR * dt * 2.8;
      g.currentR = Math.max(0.15, g.currentR);
      // scale group
      const scale = g.currentR / g.baseMajor;
      g.group.scale.set(scale, scale, scale);
      // slow rotation for visual interest
      g.mesh.rotation.z += dt*0.18 * (0.5 + g.freq*0.2);
      ripple += Math.abs(dR);
      totalVolume += 2*Math.PI*Math.PI * g.currentR * g.r * g.r;
    });

    // phase 2: void push + inter repulsion, and collect lines
    // clear previous lines
    while(lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);

    galaxies.forEach(g=>{
      ['x','y','z'].forEach(axis=>{
        const half = axis==='z'? BOX.hz : BOX.hx;
        // effective extent = (currentR + r) * scale? scale already applied via group scale, but position is unscaled; we use currentR+r as world radius approx
        const extent = g.currentR + g.r;
        const p = g.group.position[axis];
        if(Math.abs(p) + extent > half){
          const overlap = Math.abs(p) + extent - half;
          totalOverlap += overlap;
          ripple += overlap*0.55;
          const dir = -Math.sign(p) || (Math.random()-0.5);
          g.group.position[axis] += dir * overlap * controls.voidStiffness * dt * 4.2;
          g.currentR = Math.max(0.18, g.currentR - overlap*0.09);
          if(!winner && g.dR>0 && overlap>0.08){
            // breaching while growing -> winner
            if(Math.sin(elapsed*g.freq + g.phase) > 0){

          }
        }
      });
    });

    // inter-galaxy
    let contacts = 0;
    for(let i=0;i<galaxies.length;i++){
      for(let j=i+1;j<galaxies.length;j++){
        const gi = galaxies[i], gj = galaxies[j];
        const dist = gi.group.position.distanceTo(gj.group.position);
        const thresh = gi.currentR + gj.currentR + 0.58;
        if(dist < thresh){
          const overlap = thresh - dist;
          totalOverlap += overlap;
          ripple += overlap*0.9;
          contacts++;
          // push apart
          const dir = new THREE.Vector3().subVectors(gi.group.position, gj.group.position);
          if(dir.length()<0.001) dir.set((Math.random()-0.5), (Math.random()-0.5), (Math.random()-0.5));
          dir.normalize();
          const push = overlap * 0.5 * controls.interRepulsion * dt * 3.5;
          gi.group.position.addScaledVector(dir, push);
          gj.group.position.addScaledVector(dir, -push);
          gi.currentR = Math.max(0.18, gi.currentR - overlap*0.035);
          gj.currentR = Math.max(0.18, gj.currentR - overlap*0.035);
          // red line
          const geo = new THREE.BufferGeometry().setFromPoints([gi.group.position.clone(), gj.group.position.clone()]);
          const op = Math.min(0.85, overlap*1.4);
          const mat = new THREE.LineBasicMaterial({color:0xFF6B7A, transparent:true, opacity:op});
          lineGroup.add(new THREE.Line(geo, mat));
        }
      }
    }

    ripple += totalOverlap*0.3;

    // homeostasis
    if(ripple < 0.18){
      homeostaticTimer += dt;
    }else{
      homeostaticTimer = Math.max(0, homeostaticTimer - dt*0.6);
    }

    if(winner){
      // keep winner state
    }else if(homeostaticTimer > 1.0){
      systemState = 'HOMEOSTATIC';
    }else{
      // avg dR sign decides
      const avgDR = galaxies.reduce((s,g)=>s+g.dR,0)/galaxies.length;
      systemState = avgDR>0.02 ? 'EXPANDING' : avgDR<-0.02 ? 'CONTRACTING' : 'EQUILIBRATING';
      if(galaxies.every(g=>g.currentR<0.34)){
        systemState = 'WINNER: VOID';
        winner = {void:true};
      }
    }

    // trails
    // clear old trail lines from scene (we keep per galaxy line)
    galaxies.forEach(g=>{
      if(g.trailLine) scene.remove(g.trailLine);
      g.trailPositions.push(g.group.position.clone());
      if(g.trailPositions.length>26) g.trailPositions.shift();
      if(g.trailPositions.length>2){
        const tGeo = new THREE.BufferGeometry().setFromPoints(g.trailPositions);
        const tMat = new THREE.LineBasicMaterial({color:g.color, transparent:true, opacity:0.22});
        g.trailLine = new THREE.Line(tGeo, tMat);
        scene.add(g.trailLine);
      }
    });

    // subtle box pulse with ripple
    boxMesh.material.opacity = 0.20 + Math.min(0.18, ripple*0.12) + (crushActive?0.12:0);

    renderer.render(scene,camera);
    updateChips();
    updatePackTable();
    statusTextEl.innerHTML = 'the <em>Fibonacci ladder is the packing ladder</em> — visible band drawn to scale. Box 14×14×4 sheet, R∈[0.8,1.6] r∈[0.18,0.35], golden angle 137.5°. Ripple = Σ|dR| + overlaps. Trails = 24-step positional memory. Void particles flow inward during crush. Use drag to orbit, wheel to dolly. N='+currentN+' — density '+(totalVolume/784*100).toFixed(1)+'% — contacts '+contacts+' — IE-analogue '+(currentN*(currentN-1)/2 + Math.floor(currentN*1.618))+' — <em>'+systemState.toLowerCase()+'</em>.';
  }

  // UI actions
  function setupActions(){
    document.getElementById('btn-replicate').addEventListener('click', ()=>{
      const idx = FIB.indexOf(currentN);
      const next = FIB[(idx+1)%FIB.length];
      buildGalaxies(next);
    });
    document.getElementById('btn-collapse').addEventListener('click', ()=>{
      controls.amplitude = 0.06;
      controls.damping = 0.85;
      galaxies.forEach(g=>{ g.currentR *= 0.92; });
      // update slider displays
      buildSliders();
    });
    document.getElementById('btn-random').addEventListener('click', ()=>{
      galaxies.forEach(g=>{ g.phase = Math.random()*Math.PI*2; });
      homeostaticTimer=0;
      winner=null;
    });
    document.getElementById('btn-crush').addEventListener('click', ()=>{
      crushActive=true; crushT=0;
      controls.voidStiffness = Math.min(2.0, controls.voidStiffness+0.35);
      buildSliders();
    });
  }

  // boot
  initThree();
  buildSliders();
  setupActions();
  buildGalaxies(currentN);
  clock.start();
  animate();

})();
