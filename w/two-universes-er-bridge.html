// --- bridge texture swirling mandelbrot-ish noise ---
function makeSwirlTexture(){
  const size=512;
  const cvs=document.createElement('canvas');
  cvs.width=size; cvs.height=size;
  const ctx=cvs.getContext('2d');
  const img=ctx.createImageData(size,size);
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const nx = (x/size -0.5)*2;
      const ny = (y/size -0.5)*2;
      const r = Math.sqrt(nx*nx+ny*ny);
      const ang = Math.atan2(ny,nx);
      const swirl = ang*3 + r*6 + Math.sin(r*8)*1.2;
      const v = (Math.sin(swirl*2) + Math.sin(r*12 - swirl)*0.5);
      const mand = Math.sin(nx*8)*Math.sin(ny*8)*0.3;
      let t = (v+1)*0.5;
      t = Math.pow(t,1.2) + mand*0.2;
      const idx=(y*size+x)*4;
      const cyan = {r:67,g:232,b:255};
      const violet = {r:201,g:119,b:255};
      const mix = t;
      const rC = Math.floor(cyan.r*(1-mix) + violet.r*mix);
      const gC = Math.floor(cyan.g*(1-mix) + violet.g*mix);
      const bC = Math.floor(cyan.b*(1-mix) + violet.b*mix);
      const alpha = 180 + t*60;
      img.data[idx]=rC; img.data[idx+1]=gC; img.data[idx+2]=bC; img.data[idx+3]= Math.min(255, Math.max(0, alpha * (1 - r*0.25)));
    }
  }
  ctx.putImageData(img,0,0);
  // add radial streaks
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<60;i++){
    const a = rng()*Math.PI*2;
    ctx.strokeStyle = 'rgba('+(100+rng()*100)+','+(180+rng()*70)+',255,'+(0.04+rng()*0.06)+')';
    ctx.lineWidth = 1+rng()*2;
    ctx.beginPath();
    ctx.moveTo(size/2 + Math.cos(a)*10, size/2 + Math.sin(a)*10);
    ctx.lineTo(size/2 + Math.cos(a+rng()*0.6)*size*0.7, size/2 + Math.sin(a+rng()*0.6)*size*0.7);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cvs);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1,1);
  return tex;
}
const swirlTex = makeSwirlTexture();

// --- bridge curve + tube ---

  return new THREE.CatmullRomCurve3(pts);
}

// --- physics vars ---
let pressureA = 1.0;
let pressureB = 1.0;
let k_leak = 0.35;
let k_depress = 0.28;
let voidStiff = 0.62;
let bridgeOpen = false;
let deathForced = false;
let deathTimer = 0;
let systemState = 'ISOLATED';
let timeAcc = 0;
let lastTime = performance.now();

const elPA = document.getElementById('pA');
const elPB = document.getElementById('pB');

const elRippleTxt = document.getElementById('rippleTxt');

function setState(newState){
  systemState = newState;
  let bg, color, border, txt;
  if(newState==='ISOLATED'){ bg='rgba(67,232,255,.18)'; color='#43E8FF'; border='rgba(67,232,255,.35)'; txt='ISOLATED'; }
  else if(newState==='BRIDGE FORMING'){ bg='rgba(255,226,139,.18)'; color='#FFE28B'; border='rgba(255,226,139,.4)'; txt='BRIDGE FORMING'; }
  else if(newState==='DEPRESSURIZING'){ bg='rgba(255,165,80,.20)'; color='#FFB86B'; border='rgba(255,165,80,.45)'; txt='DEPRESSURIZING'; }
  else if(newState==='DEATH CYCLE'){ bg='rgba(255,107,122,.22)'; color='#FF6B7A'; border='rgba(255,107,122,.5)'; txt="DEATH CYCLE — BOTH U's BLEEDING"; }
  else if(newState==='BOTH U DEAD'){ bg='rgba(10,10,12,.9)'; color='#7D8DB2'; border='rgba(125,141,178,.3)'; txt='BOTH U DEAD — heat death'; }
  elState.style.background=bg; elState.style.color=color; elState.style.borderColor=border; elState.textContent=txt;
}

function updateToroids(dt, t){
  const all = [...torusGroups.A, ...torusGroups.B];
  let aliveCount = 0;
  all.forEach((group)=>{
    const uni = group.userData.universe;
    const P = uni==='A'?pressureA:pressureB;
    const ud = group.userData;
    // pulsation speed tied to pressure
    const freq = P * ud.baseFreq;
    const pulse = 1 + 0.14*Math.sin(t*freq + ud.basePos.x);
    // expansion logic
    if(P < 0.7){
      const needExpand = (0.7 - P)*1.8;
      ud.expansion += needExpand*dt*0.9;
      if(systemState==='DEPRESSURIZING' || systemState==='DEATH CYCLE'){
        ud.expansion += dt*0.5;
      }
    } else {
      ud.expansion *= 0.98;
    }
    let scale = ud.baseScale * pulse * (1 + ud.expansion);
    // collapse after over-expand
    if(P < 0.4){
      if(ud.expansion > 1.2){
        scale = THREE.MathUtils.lerp(scale, 0.18, dt*1.6);
        ud.phase='collapsing';
      }
    }
    if(P < 0.18){
      scale = THREE.MathUtils.lerp(scale, 0.12, dt*2.2);
      ud.alive = false;
    }
    if(scale>0.2) aliveCount++;
    group.scale.setScalar(scale);
    group.rotation.x += ud.rotSpeed.x * dt * (0.4 + P*0.6);
    group.rotation.y += ud.rotSpeed.y * dt * (0.4 + P*0.6);
    // color turning red then black
    if(P < 0.65){
      const redShift = THREE.MathUtils.clamp((0.65 - P)/0.5,0,1);
      const target = new THREE.Color().setHSL(0.0, 0.85, 0.55 - redShift*0.4);
      ud.mesh.material.color.lerp(target, dt*0.8*redShift);
      ud.mesh.material.emissive.lerp(target.clone().multiplyScalar(0.2), dt*0.8*redShift);
      if(P < 0.3){
        ud.mesh.material.opacity = THREE.MathUtils.lerp(ud.mesh.material.opacity, 0.18, dt*1.2);
      }
    } else {
      // restore a bit when isolated
      if(ud.mesh.material.opacity < 0.92) ud.mesh.material.opacity = THREE.MathUtils.lerp(ud.mesh.material.opacity, 0.92, dt*0.5);
    }
    // confinement sag: group position stays but we could jitter
    if(P<0.7){
      group.position.x = ud.universe==='A' ? -7 + (Math.sin(t*0.7+ud.basePos.x)* (0.7-P)*0.6) : 7 + (Math.sin(t*0.9+ud.basePos.z)* (0.7-P)*0.6);
    }
  });
  return aliveCount;
}

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime)/1000);
  lastTime = now;
  timeAcc += dt;

  // controls
  controls.update();

  // physics
  if(!bridgeOpen){
    // isolated homeostasis with noise
    const noiseA = (rng()-0.5)*0.02;
    const noiseB = (rng()-0.5)*0.02;
    pressureA += (1.0 - pressureA)*0.02*voidStiff + noiseA*dt*10;
    pressureB += (1.0 - pressureB)*0.02*voidStiff + noiseB*dt*10;
    targetThroat = 0.05;
    throatRadius = THREE.MathUtils.lerp(throatRadius, targetThroat, dt*2);
    if(systemState!=='ISOLATED' && !deathForced) setState('ISOLATED');
  } else {
    // bridge forming / open
    if(throatRadius < 0.6 && !deathForced){
      targetThroat = 0.8;
      if(systemState!=='BRIDGE FORMING' && systemState!=='DEPRESSURIZING') setState('BRIDGE FORMING');
    } else if(deathForced){
      targetThroat = 1.2;
    } else {
      targetThroat = 0.85;
    }
    throatRadius = THREE.MathUtils.lerp(throatRadius, targetThroat, dt*1.8);

    // equalization and depressurization
    const dEqualA = -k_leak * (pressureA - pressureB);
    const dEqualB = -k_leak * (pressureB - pressureA);
    const dDepress = -k_depress * throatRadius*throatRadius;
    const restoreA = (1.0 - pressureA)*0.02*voidStiff;
    const restoreB = (1.0 - pressureB)*0.02*voidStiff;
    pressureA += (dEqualA*0.6 + dDepress + restoreA)*dt;
    pressureB += (dEqualB*0.6 + dDepress + restoreB)*dt;
    pressureA = THREE.MathUtils.clamp(pressureA, 0.05, 1.6);
    pressureB = THREE.MathUtils.clamp(pressureB, 0.05, 1.6);

    if(throatRadius > 0.6 && (pressureA<0.75 || pressureB<0.75)){
      if(systemState==='BRIDGE FORMING') setState('DEPRESSURIZING');
    }
    if(pressureA < 0.3 || pressureB < 0.3){
      deathTimer += dt;
      if(deathTimer > 1.0 && systemState!=='DEATH CYCLE' && systemState!=='BOTH U DEAD'){
        setState('DEATH CYCLE');
      }
    } else {
      deathTimer = Math.max(0, deathTimer - dt*0.5);
    }
    if(pressureA < 0.15 && pressureB < 0.15){
      setState('BOTH U DEAD');
      targetThroat = 0.0;
      throatRadius = THREE.MathUtils.lerp(throatRadius, 0, dt*0.8);
    }
  }

  // boxes sag when depressurizing
  const sagA = (1 - pressureA)*0.15;
  const sagB = (1 - pressureB)*0.15;
  boxA.mesh.scale.set(1+sagA*0.3, 1 - sagA*0.2, 1+sagA*0.3);
  boxB.mesh.scale.set(1+sagB*0.3, 1 - sagB*0.2, 1+sagB*0.3);
  boxA.lines.scale.copy(boxA.mesh.scale);
  boxB.lines.scale.copy(boxB.mesh.scale);
  // flicker when death
  if(systemState==='DEATH CYCLE'){
    const flick = 0.18 + Math.sin(timeAcc*18)*0.12;
    boxA.mesh.material.opacity = flick;
    boxB.mesh.material.opacity = flick;
    boxA.lines.material.opacity = flick+0.1;
    boxB.lines.material.opacity = flick+0.1;
  } else if(systemState==='BOTH U DEAD'){
    boxA.mesh.material.opacity = THREE.MathUtils.lerp(boxA.mesh.material.opacity, 0.05, dt*0.6);
    boxB.mesh.material.opacity = THREE.MathUtils.lerp(boxB.mesh.material.opacity, 0.05, dt*0.6);
    boxA.lines.material.opacity = THREE.MathUtils.lerp(boxA.lines.material.opacity, 0.08, dt*0.6);
    boxB.lines.material.opacity = THREE.MathUtils.lerp(boxB.lines.material.opacity, 0.08, dt*0.6);
  } else {
    boxA.mesh.material.opacity = THREE.MathUtils.lerp(boxA.mesh.material.opacity, 0.25, dt*2);
    boxB.mesh.material.opacity = THREE.MathUtils.lerp(boxB.mesh.material.opacity, 0.25, dt*2);
    boxA.lines.material.opacity = THREE.MathUtils.lerp(boxA.lines.material.opacity, 0.32, dt*2);
    boxB.lines.material.opacity = THREE.MathUtils.lerp(boxB.lines.material.opacity, 0.32, dt*2);
  }

  // bridge rebuild when wobble changed significantly or radius changed a lot
  const needRebuild = Math.abs(tubeMesh.geometry.parameters.radius - throatRadius) > 0.015;
  if(needRebuild){
    buildTube();
  }
  // update curve wobble live
  bridgeCurve = buildCurve();
  // update throat position
  throatMesh.position.copy(bridgeCurve.getPoint(0.5));
  throatMesh.scale.setScalar(Math.max(0.02, throatRadius*1.3));
  const c1 = new THREE.Color('#43E8FF');
  const c2 = new THREE.Color('#C977FF');
  const c3 = new THREE.Color('#FF6B7A');
  let bridgeColor;
  if(systemState==='ISOLATED') bridgeColor=c1;
  else if(systemState==='BRIDGE FORMING') bridgeColor=c1.clone().lerp(c2, (throatRadius-0.05)/0.75);
  else if(systemState==='DEPRESSURIZING') bridgeColor=c2.clone().lerp(c3, 0.4);
  else bridgeColor=c3;
  if(tubeMesh){
    tubeMesh.material.emissive.copy(bridgeColor);
    tubeMesh.material.emissiveIntensity = 0.35 + throatRadius*0.65;
    swirlTex.offset.x += dt*0.18*(0.5+throatRadius);
    swirlTex.offset.y += dt*0.07;
  }
  throatMat.uniforms.c.value.copy(bridgeColor);
  pointThroat.color.copy(bridgeColor);
  pointThroat.intensity = 0.6 + throatRadius*1.4;
  pointThroat.position.copy(throatMesh.position);

  // particles
  particles.forEach((p)=>{
    p.userData.t += p.userData.dir * p.userData.speed * dt * (0.6 + throatRadius);
    if(p.userData.t>1) p.userData.t=0;
    if(p.userData.t<0) p.userData.t=1;
    const pos = bridgeCurve.getPoint(p.userData.t);
    p.position.copy(pos);
    p.material.opacity = 0.2 + throatRadius*0.7;
    p.scale.setScalar(0.7 + throatRadius*0.8);
  });

  // leak particles during death
  const voidInvasion = systemState==='DEATH CYCLE' || systemState==='BOTH U DEAD' ? 1 : (systemState==='DEPRESSURIZING'? (0.7-pressureA)*1.2 : 0);
  leakParticles.forEach((lp, idx)=>{
    if(voidInvasion>0.1){
      lp.material.opacity = THREE.MathUtils.lerp(lp.material.opacity, Math.min(0.85, voidInvasion), dt*2);
      // move outward from center
      lp.userData.vel.x += (rng()-0.5)*0.02;
      lp.userData.vel.y += (rng()-0.5)*0.02;
      lp.userData.vel.z += (rng()-0.5)*0.02;
      lp.position.add(lp.userData.vel.clone().multiplyScalar(dt*2));
      if(lp.position.length()>12){
        lp.position.set((rng()-0.5)*1, (rng()-0.5)*1, (rng()-0.5)*1);
        lp.position.add(new THREE.Vector3(idx%2===0?-7:7,0,0));
      }
    } else {
      lp.material.opacity = THREE.MathUtils.lerp(lp.material.opacity, 0, dt*2);
    }
  });

  const alive = updateToroids(dt, timeAcc);

  // HUD updates
  elPA.textContent = pressureA.toFixed(2);
  elPB.textContent = pressureB.toFixed(2);
  elThroat.textContent = throatRadius.toFixed(2);
  ledgerA.textContent = pressureA.toFixed(3);
  ledgerB.textContent = pressureB.toFixed(3);
  ledgerDelta.textContent = (pressureA-pressureB).toFixed(3);
  ledgerThroat.textContent = throatRadius.toFixed(3);
  ledgerFlux.textContent = (k_leak*Math.abs(pressureA-pressureB) + k_depress*throatRadius*throatRadius).toFixed(2);
  ledgerVoid.textContent = Math.round(THREE.MathUtils.clamp(voidInvasion,0,1)*100) + '%';
  ledgerGal.textContent = alive + ' / ' + (torusGroups.A.length+torusGroups.B.length);

  const rippleBound = pressureA>0.55 && pressureB>0.55 && systemState!=='DEATH CYCLE' && systemState!=='BOTH U DEAD';
  elRippleTxt.textContent = rippleBound ? 'TRUE' : 'FALSE';
  elRippleDot.style.background = rippleBound ? '#78F0B1' : '#FF6B7A';
  document.getElementById('rippleChip').style.borderColor = rippleBound ? 'rgba(120,240,177,.25)' : 'rgba(255,107,122,.35)';

  // status text dynamic
  if(systemState==='ISOLATED'){
    statusText.textContent = 'Two pressure vessels. Both homeostatic at P≈1.0. Ripple within bound. Boxes taut, toroids pulsating stable. Opening ER bridge adds negative volume.';
  } else if(systemState==='BRIDGE FORMING'){
    statusText.textContent = 'Bridge forming: throat ' + throatRadius.toFixed(2) + '. Curve dip y=-2 with wobble ' + wobbleParam.toFixed(2) + '. Pressures equalizing via k_leak, but both losing to void via k_depress·r². Flux rising.';
  } else if(systemState==='DEPRESSURIZING'){
    statusText.textContent = 'Depressurizing! Throat >0.6, total confinement ↓. Toroids lose containment, over-expand by ' + (torusGroups.A[0]?.userData.expansion.toFixed(2)||'0') + '×, then void floods through bridge. P_A=' + pressureA.toFixed(2) + ' P_B=' + pressureB.toFixed(2);
  } else if(systemState==='DEATH CYCLE'){
    statusText.textContent = "DEATH CYCLE — BOTH U's BLEEDING. P <0.3 for >1s. Void invasion " + Math.round(voidInvasion*100) + "%. Toroids collapsing to 0.2, boxes flickering, particles leaking outward. Bridge still open, depressurizing both.";
  } else {
    statusText.textContent = 'BOTH U DEAD — heat death. P≈0.1, all toroids collapsed, box opacities 0.05, bridge throat collapses to 0. Both universes died faster together than alone. Reset to try again.';
  }

  renderer.render(scene, camera);
}
animate();

// --- controls wiring ---
document.getElementById('btnOpen').onclick = ()=>{ bridgeOpen=true; deathForced=false; deathTimer=0; if(systemState==='ISOLATED') setState('BRIDGE FORMING'); };
document.getElementById('btnClose').onclick = ()=>{ bridgeOpen=false; targetThroat=0.05; deathForced=false; };
document.getElementById('btnDeath').onclick = ()=>{ bridgeOpen=true; deathForced=true; targetThroat=1.2; setState('DEPRESSURIZING'); pressureA*=0.7; pressureB*=0.7; };
document.getElementById('btnReset').onclick = ()=>{
  bridgeOpen=false; deathForced=false; deathTimer=0; pressureA=1.0; pressureB=1.0; throatRadius=0.05; targetThroat=0.05;
  torusGroups.A.concat(torusGroups.B).forEach(g=>{ g.userData.expansion=0; g.userData.alive=true; g.scale.setScalar(g.userData.baseScale); g.userData.mesh.material.opacity=0.92; g.userData.mesh.material.color.copy(g.userData.col); });
  setState('ISOLATED');
  leakParticles.forEach(lp=>{ lp.position.set(0,0,0); lp.material.opacity=0; });
};
document.getElementById('btnAddA').onclick = ()=>{ createTorusGalaxy('A', torusGroups.A.length); };
document.getElementById('btnAddB').onclick = ()=>{ createTorusGalaxy('B', torusGroups.B.length); };

function bindSlider(id, setter, displayId, factor){

  const d=document.getElementById(displayId);
  el.oninput = ()=>{
    const v = parseInt(el.value)/100;
    setter(v);
    d.textContent = v.toFixed(2);
  };
}
bindSlider('sStiff', (v)=>{ voidStiff=v; }, 'vStiff');
bindSlider('sLeak', (v)=>{ k_leak=v; }, 'vLeak');
bindSlider('sDepress', (v)=>{ k_depress=v*0.8; }, 'vDepress');
bindSlider('sWob', (v)=>{ wobbleParam=v; document.getElementById('vWob').textContent=v.toFixed(2); }, 'vWob');

window.addEventListener('resize', ()=>{
  const w = canvas.clientWidth, h=canvas.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
});
